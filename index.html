<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSPDF - PDF Editor</title>

  <link rel="stylesheet" href="style.css">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- PDF-Lib -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

  <header class="topbar">

    <div class="logo">
      <span class="logo-box">S</span>
      <span>SSPDF</span>
      <small>PDF Editor</small>
    </div>

    <div class="privacy">
      🔒 Files stay on your device
    </div>

  </header>


  <main id="uploadScreen" class="upload-screen">

    <div id="dropZone" class="drop-zone">

      <div class="pdf-icon">
        PDF
      </div>

      <h1>Edit PDF Online</h1>

      <p>
        Open your PDF and edit it directly in your browser.
      </p>

      <p class="safe">
        🔒 Your PDF is processed locally and is never uploaded.
      </p>

      <label for="fileInput" class="choose-button">
        Choose PDF
      </label>

      <input
        type="file"
        id="fileInput"
        accept="application/pdf"
        hidden
      >

      <div class="drop-text">
        or drag & drop your PDF here
      </div>

    </div>

  </main>


  <main id="editorScreen" class="editor hidden">

    <div class="toolbar">

      <button id="openButton">
        📂 Open
      </button>

      <span class="divider"></span>

      <button id="previousPage">
        ◀
      </button>

      <span id="pageNumber">
        1 / 1
      </span>

      <button id="nextPage">
        ▶
      </button>

      <span class="divider"></span>

      <button id="zoomMinus">
        −
      </button>

      <span id="zoomValue">
        100%
      </span>

      <button id="zoomPlus">
        +
      </button>

      <span class="divider"></span>

      <button id="textTool">
        T Text
      </button>

      <button id="deleteTool">
        🗑 Delete
      </button>

      <button id="undoTool">
        ↶ Undo
      </button>

      <div class="toolbar-space"></div>

      <button id="downloadButton" class="download">
        ⬇ Download
      </button>

    </div>


    <div class="workspace">

      <div class="pdf-area">

        <div id="pdfPage" class="pdf-page">

          <canvas id="pdfCanvas"></canvas>

          <div
            id="textLayer"
            class="text-layer"
          ></div>

        </div>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
