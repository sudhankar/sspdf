<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SSPDF Editor</title>

<meta
  name="description"
  content="Free online PDF editor. Edit and manage PDF files privately in your browser."
>


<style>

/* =========================================
   RESET
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f5f7fb;

  color: #202124;

  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
}


/* =========================================
   TOP BAR
========================================= */

.topbar {

  height: 64px;

  background: #ffffff;

  border-bottom:
    1px solid #e5e7eb;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 18px;

  position: relative;

  z-index: 100;
}


.logo {

  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 21px;

  font-weight: 700;

  color: #111827;
}


.logo-icon {

  width: 38px;

  height: 38px;

  border-radius: 10px;

  background: #2563eb;

  color: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-weight: bold;

  font-size: 18px;
}


.top-actions {

  display: flex;

  align-items: center;

  gap: 8px;
}


.btn {

  border:
    1px solid #d9dee8;

  background: white;

  padding:
    9px 14px;

  border-radius: 8px;

  font-size: 14px;

  color: #374151;
}


.btn:hover {

  background: #f3f4f6;
}


.btn-primary {

  background: #2563eb;

  color: white;

  border-color: #2563eb;

  font-weight: 600;
}


.btn-primary:hover {

  background: #1d4ed8;
}


.btn:disabled {

  opacity: 0.65;

  cursor: not-allowed;
}


/* =========================================
   MOBILE MENU BUTTON
========================================= */

.mobile-menu {

  display: none;

  border: 0;

  background: transparent;

  font-size: 23px;

  color: #374151;
}


/* =========================================
   WORKSPACE
========================================= */

.workspace {

  height:
    calc(100vh - 64px);

  display: flex;

  min-width: 0;
}


/* =========================================
   LEFT TOOL SIDEBAR
========================================= */

.sidebar {

  width: 190px;

  flex-shrink: 0;

  background: #ffffff;

  border-right:
    1px solid #e5e7eb;

  padding:
    16px 10px;

  overflow-y: auto;
}


.sidebar-title {

  font-size: 12px;

  font-weight: 700;

  color: #9ca3af;

  text-transform: uppercase;

  margin:
    4px 8px 12px;
}


.tool {

  width: 100%;

  border: 0;

  background: transparent;

  display: flex;

  align-items: center;

  gap: 11px;

  padding:
    11px 12px;

  border-radius: 8px;

  color: #374151;

  font-size: 14px;

  text-align: left;

  margin-bottom: 3px;
}


.tool:hover {

  background: #f3f4f6;
}


.tool.active {

  background: #eff6ff;

  color: #2563eb;

  font-weight: 600;
}


.tool-icon {

  width: 23px;

  text-align: center;

  font-size: 17px;
}


/* =========================================
   CENTER AREA
========================================= */

.editor-area {

  flex: 1;

  min-width: 0;

  display: flex;

  flex-direction: column;
}


/* =========================================
   ZOOM TOOLBAR
========================================= */

.document-toolbar {

  height: 54px;

  flex-shrink: 0;

  background: white;

  border-bottom:
    1px solid #e5e7eb;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;
}


.zoom-control {

  display: flex;

  align-items: center;

  gap: 7px;
}


.zoom-control button {

  width: 36px;

  height: 34px;

  border:
    1px solid #e1e5eb;

  background: white;

  border-radius: 7px;

  font-size: 16px;
}


.zoom-control button:hover {

  background: #f3f4f6;
}


.zoom-value {

  min-width: 65px;

  text-align: center;

  font-size: 13px;

  color: #4b5563;
}


/* =========================================
   PDF WORKSPACE
========================================= */

.editor-body {

  flex: 1;

  min-height: 0;

  display: flex;
}


/* =========================================
   PAGE THUMBNAIL SIDEBAR
========================================= */

.page-sidebar {

  width: 170px;

  flex-shrink: 0;

  background: #f8fafc;

  border-right:
    1px solid #e5e7eb;

  padding:
    12px 10px;

  overflow-y: auto;
}


.page-sidebar-title {

  font-size: 12px;

  font-weight: 700;

  color: #6b7280;

  margin:
    4px 5px 12px;
}


.page-thumbnail {

  position: relative;

  background: white;

  border:
    2px solid transparent;

  border-radius: 8px;

  padding: 5px;

  margin-bottom: 12px;

  cursor: pointer;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.08);
}


.page-thumbnail:hover {

  border-color: #bfdbfe;
}


.page-thumbnail.active {

  border-color: #2563eb;
}


.page-thumbnail canvas {

  display: block;

  width: 100%;

  height: auto;

  border-radius: 4px;
}


.page-number {

  text-align: center;

  font-size: 11px;

  color: #6b7280;

  margin-top: 4px;
}


.page-actions {

  display: flex;

  justify-content: center;

  gap: 4px;

  margin-top: 5px;
}


.page-actions button {

  width: 29px;

  height: 26px;

  border:
    1px solid #e5e7eb;

  background: white;

  border-radius: 5px;

  font-size: 12px;
}


.page-actions button:hover {

  background: #f3f4f6;
}


/* =========================================
   MAIN PDF VIEWER
========================================= */

.main-document {

  flex: 1;

  min-width: 0;

  min-height: 0;

  overflow: auto;

  background: #e9edf3;

  padding: 25px;
}


/* =========================================
   EMPTY STATE
========================================= */

.empty-state {

  width:
    min(600px, 100%);

  margin:
    8vh auto 0;

  background: white;

  border-radius: 16px;

  padding:
    45px 30px;

  text-align: center;

  box-shadow:
    0 8px 35px rgba(0,0,0,0.06);
}


.upload-icon {

  width: 76px;

  height: 76px;

  margin: auto;

  border-radius: 20px;

  background: #eff6ff;

  color: #2563eb;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 35px;
}


.empty-state h1 {

  font-size: 25px;

  margin-top: 20px;

  color: #111827;
}


.empty-state p {

  margin:
    12px auto 25px;

  max-width: 440px;

  color: #6b7280;

  line-height: 1.6;

  font-size: 14px;
}


.choose-btn {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  border: 0;

  background: #2563eb;

  color: white;

  padding:
    12px 21px;

  border-radius: 9px;

  font-size: 15px;

  font-weight: 600;
}


.choose-btn:hover {

  background: #1d4ed8;
}


.privacy {

  margin-top: 18px;

  font-size: 12px;

  color: #9ca3af;
}


/* =========================================
   PDF PAGE
========================================= */

.pdf-page-wrapper {

  position: relative;

  width: fit-content;

  max-width: 100%;

  margin:
    0 auto 25px;
}


.pdf-page-wrapper canvas {

  display: block;

  background: white;

  box-shadow:
    0 4px 18px rgba(0,0,0,0.12);

  max-width: 100%;

  height: auto;
}


.pdf-page-wrapper.selected-page canvas {

  outline:
    3px solid #2563eb;
}


.page-label {

  position: absolute;

  top: 8px;

  left: 8px;

  background:
    rgba(0,0,0,0.65);

  color: white;

  padding:
    4px 8px;

  border-radius: 5px;

  font-size: 11px;

  z-index: 5;
}


/* =========================================
   RIGHT INFORMATION PANEL
========================================= */

.right-panel {

  width: 225px;

  flex-shrink: 0;

  background: white;

  border-left:
    1px solid #e5e7eb;

  padding:
    18px 14px;

  overflow-y: auto;
}


.panel-title {

  font-size: 13px;

  font-weight: 700;

  color: #6b7280;

  margin-bottom: 13px;
}


.panel-card {

  border:
    1px solid #e5e7eb;

  border-radius: 10px;

  padding: 12px;

  margin-bottom: 10px;

  font-size: 13px;

  color: #4b5563;

  word-break: break-word;
}


.panel-card strong {

  display: block;

  color: #111827;

  margin-bottom: 5px;
}


/* =========================================
   MOBILE BOTTOM BAR
========================================= */

.mobile-bottom {

  display: none;
}


/* =========================================
   PRINT
========================================= */

@media print {

  .topbar,
  .sidebar,
  .page-sidebar,
  .right-panel,
  .document-toolbar,
  .mobile-bottom {

    display: none !important;
  }

  .workspace {

    height: auto;
  }

  .editor-area {

    width: 100%;
  }

  .main-document {

    overflow: visible;

    background: white;

    padding: 0;
  }

  .pdf-page-wrapper {

    page-break-after: always;
  }
}


/* =========================================
   TABLET / MOBILE
========================================= */

@media (max-width: 850px) {

  body {

    overflow: hidden;
  }


  .topbar {

    height: 58px;

    padding:
      0 12px;
  }


  .mobile-menu {

    display: block;
  }


  .logo {

    font-size: 18px;

    margin-right: auto;

    margin-left: 8px;
  }


  .logo-icon {

    width: 34px;

    height: 34px;

    font-size: 16px;
  }


  .top-actions {

    gap: 5px;
  }


  .top-actions .desktop-btn {

    display: none;
  }


  .top-actions .btn:not(.btn-primary) {

    display: none;
  }


  .btn-primary {

    padding:
      8px 11px;

    font-size: 13px;
  }


  .workspace {

    height:
      calc(100vh - 58px);
  }


  .sidebar {

    position: fixed;

    left: -250px;

    top: 58px;

    bottom: 62px;

    width: 230px;

    z-index: 200;

    box-shadow:
      5px 0 20px rgba(0,0,0,0.12);

    transition:
      left 0.25s ease;
  }


  .sidebar.open {

    left: 0;
  }


  .right-panel {

    display: none;
  }


  .document-toolbar {

    height: 48px;
  }


  .page-sidebar {

    position: fixed;

    left: -190px;

    top: 58px;

    bottom: 62px;

    width: 180px;

    z-index: 190;

    box-shadow:
      5px 0 20px rgba(0,0,0,0.12);

    transition:
      left 0.25s ease;
  }


  .page-sidebar.open {

    left: 0;
  }


  .main-document {

    padding:
      15px 8px 80px;
  }


  .empty-state {

    margin-top: 7vh;

    padding:
      35px 18px;
  }


  .empty-state h1 {

    font-size: 21px;
  }


  .empty-state p {

    font-size: 13px;
  }


  .upload-icon {

    width: 65px;

    height: 65px;

    font-size: 30px;
  }


  .mobile-bottom {

    display: flex;

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 62px;

    background: white;

    border-top:
      1px solid #e5e7eb;

    z-index: 180;

    justify-content:
      space-around;

    align-items: center;
  }


  .bottom-tool {

    border: 0;

    background: transparent;

    font-size: 11px;

    color: #4b5563;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 3px;
  }


  .bottom-tool span:first-child {

    font-size: 19px;
  }

}


/* =========================================
   SMALL MOBILE
========================================= */

@media (max-width: 500px) {

  .logo {

    font-size: 16px;
  }


  .logo-icon {

    width: 32px;

    height: 32px;
  }


  .main-document {

    padding:
      12px 5px 80px;
  }


  .pdf-page-wrapper {

    margin-bottom: 15px;
  }


  .zoom-value {

    min-width: 50px;
  }

}

</style>

</head>


<body>

     TOP BAR
========================================= -->

<header class="topbar">


  <button
    class="mobile-menu"

    aria-label="Open tools"

    ☰
  </button>

    <div class="logo-icon">
      S

  </div>

      onclick="redoAction()"

    >

<!-- =========================================

<main class="workspace">


  <!-- =======================================

  <aside

    <button

      </span>

      Pages

    </button>


    <button class="tool">

      <span class="tool-icon">

      </span>

    </button>


    <button class="tool">

      <span class="tool-icon">
        🖍️
      </span>

      Highlight

    </button>


    <button class="tool">

      <span class="tool-icon">
        T
      </span>

      Text Box

    </button>


    <button class="tool">

      <span class="tool-icon">
        ✍️
      </span>

      Signature

    <button class="tool">

     PDF.JS

  src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">

<!-- =========================================
     PDF-LIB
========================================= -->

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
</script>



<script>


/* =========================================
   GLOBAL VARIABLES
========================================= */

let currentPDF = null;

let originalPDFBytes = null;

let originalFileName = "document.pdf";

let zoomLevel = 1.3;

let pageRotations = {};

let deletedPages = new Set();

let selectedPage = 1;


/* =========================================
   PDF.JS WORKER
========================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================
   OPEN FILE BUTTON
========================================= */

function openFile() {

  const input =
    document.getElementById("pdfFile");

  if (input) {

    input.click();

  }

}


/* =========================================
   MOBILE MENU
========================================= */

function toggleMenu() {

  const sidebar =
    document.getElementById("sidebar");

  if (sidebar) {

    sidebar.classList.toggle("open");

  }

}


/* =========================================
   PAGE PANEL MOBILE
========================================= */

function openPagesPanel() {

  const pageSidebar =
    document.getElementById("pageSidebar");

  if (pageSidebar) {

    pageSidebar.classList.toggle("open");

  }

}


/* =========================================
   PDF FILE SELECTED
========================================= */

const pdfFile =
  document.getElementById("pdfFile");


if (pdfFile) {


  pdfFile.addEventListener(
    "change",
    async function() {


      const file =
        this.files[0];


      if (!file) {

        return;

      }


      if (
        file.type !== "application/pdf" &&
        !file.name
          .toLowerCase()
          .endsWith(".pdf")
      ) {

        alert(
          "कृपया केवल PDF file चुनें।"
        );

        return;

      }


      try {


        /* =================================
           SAVE FILE NAME
        ================================= */

        originalFileName =
          file.name;


        /* =================================
           READ ORIGINAL FILE
        ================================= */

        const arrayBuffer =
          await file.arrayBuffer();


        /*
          IMPORTANT FIX:

          Original PDF का एक बिल्कुल
          अलग और सुरक्षित copy रखें।

          PDF.js को दूसरी copy देंगे।
        */

        originalPDFBytes =
          new Uint8Array(
            arrayBuffer.slice(0)
          );


        /*
          PDF.js के लिए अलग copy
        */

        const viewerBytes =
          new Uint8Array(
            originalPDFBytes
          );


        /* =================================
           LOAD PDF.JS
        ================================= */

        currentPDF =
          await pdfjsLib
            .getDocument({
              data: viewerBytes
            })
            .promise;


        console.log(
          "PDF loaded:",
          currentPDF.numPages,
          "pages"
        );


        /* =================================
           RESET EDITOR
        ================================= */

        pageRotations = {};

        deletedPages =
          new Set();

        selectedPage = 1;

        zoomLevel = 1.3;


        /* =================================
           RENDER PDF
        ================================= */

        await renderPDF();


        /* =================================
           UPDATE INFO
        ================================= */

        updateDocumentInfo();


        /* =================================
           CLOSE MOBILE SIDEBAR
        ================================= */

        const sidebar =
          document.getElementById("sidebar");

        if (sidebar) {

          sidebar.classList.remove("open");

        }


      } catch (error) {


        console.error(
          "PDF OPEN ERROR:",
          error
        );


        alert(
          "PDF खोलने में समस्या हुई।\n\n" +
          error.message
        );

      }


    }
  );

}


/* =========================================
   RENDER ENTIRE PDF
========================================= */

async function renderPDF() {


  if (!currentPDF) {

    return;

  }


  const viewer =
    document.getElementById(
      "pdfViewer"
    );


  const thumbnails =
    document.getElementById(
      "thumbnails"
    );


  if (!viewer || !thumbnails) {

    return;

  }


  /* Clear viewer */

  viewer.innerHTML = "";

  thumbnails.innerHTML = "";


  /* Render pages */

  for (
    let pageNumber = 1;
    pageNumber <= currentPDF.numPages;
    pageNumber++
  ) {


    /* Skip deleted pages */

    if (
      deletedPages.has(pageNumber)
    ) {

      continue;

    }


    await renderMainPage(
      pageNumber
    );


    await renderThumbnail(
      pageNumber
    );

  }


  updateZoomText();

  updateDocumentInfo();

  updateSelectedPage();

}


/* =========================================
   RENDER MAIN PDF PAGE
========================================= */

async function renderMainPage(
  pageNumber
) {


  const page =
    await currentPDF.getPage(
      pageNumber
    );


  const rotation =
    pageRotations[pageNumber] || 0;


  const viewport =
    page.getViewport({

      scale:
        zoomLevel,

      rotation:
        rotation

    });


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "pdf-page-wrapper";


  wrapper.dataset.page =
    pageNumber;


  if (
    pageNumber === selectedPage
  ) {

    wrapper.classList.add(
      "selected-page"
    );

  }


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "page-label";


  label.textContent =
    "Page " + pageNumber;


  const canvas =
    document.createElement(
      "canvas"
    );


  const context =
    canvas.getContext(
      "2d"
    );


  canvas.width =
    viewport.width;


  canvas.height =
    viewport.height;


  wrapper.appendChild(
    label
  );


  wrapper.appendChild(
    canvas
  );


  document
    .getElementById(
      "pdfViewer"
    )
    .appendChild(
      wrapper
    );


  await page.render({

    canvasContext:
      context,

    viewport:
      viewport

  }).promise;


  wrapper.addEventListener(
    "click",
    function() {


      selectedPage =
        pageNumber;


      updateSelectedPage();


    }
  );

}


/* =========================================
   RENDER THUMBNAIL
========================================= */

async function renderThumbnail(
  pageNumber
) {


  const page =
    await currentPDF.getPage(
      pageNumber
    );


  const rotation =
    pageRotations[pageNumber] || 0;


  const viewport =
    page.getViewport({

      scale:
        0.25,

      rotation:
        rotation

    });


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "page-thumbnail";


  box.dataset.page =
    pageNumber;


  if (
    pageNumber === selectedPage
  ) {

    box.classList.add(
      "active"
    );

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  const context =
    canvas.getContext(
      "2d"
    );


  canvas.width =
    viewport.width;


  canvas.height =
    viewport.height;


  const number =
    document.createElement(
      "div"
    );


  number.className =
    "page-number";


  number.textContent =
    "Page " + pageNumber;


  const actions =
    document.createElement(
      "div"
    );


  actions.className =
    "page-actions";


  /* =================================
     ROTATE BUTTON
  ================================= */

  const rotateButton =
    document.createElement(
      "button"
    );


  rotateButton.innerHTML =
    "↻";


  rotateButton.title =
    "Rotate page";


  rotateButton.onclick =
    function(event) {


      event.stopPropagation();


      rotatePage(
        pageNumber
      );


    };


  /* =================================
     DELETE BUTTON
  ================================= */

  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.innerHTML =
    "🗑";


  deleteButton.title =
    "Delete page";


  deleteButton.onclick =
    function(event) {


      event.stopPropagation();


      deletePage(
        pageNumber
      );


    };


  actions.appendChild(
    rotateButton
  );


  actions.appendChild(
    deleteButton
  );


  box.appendChild(
    canvas
  );


  box.appendChild(
    number
  );


  box.appendChild(
    actions
  );


  document
    .getElementById(
      "thumbnails"
    )
    .appendChild(
      box
    );


  await page.render({

    canvasContext:
      context,

    viewport:
      viewport

  }).promise;


  box.onclick =
    function() {


      selectedPage =
        pageNumber;


      scrollToPage(
        pageNumber
      );


      updateSelectedPage();


    };

}


/* =========================================
   SCROLL TO PAGE
========================================= */

function scrollToPage(
  pageNumber
) {


  const page =
    document.querySelector(
      '.pdf-page-wrapper[data-page="' +
      pageNumber +
      '"]'
    );


  if (page) {

    page.scrollIntoView({

      behavior:
        "smooth",

      block:
        "start"

    });

  }

}


/* =========================================
   UPDATE SELECTED PAGE
========================================= */

function updateSelectedPage() {


  document
    .querySelectorAll(
      ".pdf-page-wrapper"
    )
    .forEach(
      function(element) {


        element.classList.remove(
          "selected-page"
        );


      }
    );


  document
    .querySelectorAll(
      ".page-thumbnail"
    )
    .forEach(
      function(element) {


        element.classList.remove(
          "active"
        );


      }
    );


  const mainPage =
    document.querySelector(
      '.pdf-page-wrapper[data-page="' +
      selectedPage +
      '"]'
    );


  const thumbnail =
    document.querySelector(
      '.page-thumbnail[data-page="' +
      selectedPage +
      '"]'
    );


  if (mainPage) {

    mainPage.classList.add(
      "selected-page"
    );

  }


  if (thumbnail) {

    thumbnail.classList.add(
      "active"
    );

  }

}


/* =========================================
   ROTATE PAGE
========================================= */

async function rotatePage(
  pageNumber
) {


  if (!currentPDF) {

    return;

  }


  pageRotations[pageNumber] =
    (
      pageRotations[pageNumber] || 0
    ) + 90;


  if (
    pageRotations[pageNumber] >= 360
  ) {

    pageRotations[pageNumber] = 0;

  }


  selectedPage =
    pageNumber;


  await renderPDF();

}


/* =========================================
   ROTATE SELECTED PAGE
========================================= */

async function rotateSelectedPage() {


  if (!currentPDF) {

    alert(
      "पहले PDF खोलें।"
    );

    return;

  }


  await rotatePage(
    selectedPage
  );

}


/* =========================================
   DELETE PAGE
========================================= */

async function deletePage(
  pageNumber
) {


  if (!currentPDF) {

    return;

  }


  const remainingPages =
    currentPDF.numPages -
    deletedPages.size -
    1;


  if (
    remainingPages < 1
  ) {

    alert(
      "कम से कम एक page रखना जरूरी है।"
    );

    return;

  }


  const confirmDelete =
    confirm(
      "क्या आप Page " +
      pageNumber +
      " को हटाना चाहते हैं?"
    );


  if (!confirmDelete) {

    return;

  }


  deletedPages.add(
    pageNumber
  );


  /* Find another visible page */

  selectedPage = 1;


  while (
    deletedPages.has(
      selectedPage
    ) &&
    selectedPage <=
      currentPDF.numPages
  ) {

    selectedPage++;

  }


  await renderPDF();

}


/* =========================================
   DELETE SELECTED PAGE
========================================= */

async function deleteSelectedPage() {


  if (!currentPDF) {

    alert(
      "पहले PDF खोलें।"
    );

    return;

  }


  await deletePage(
    selectedPage
  );

}


/* =========================================
   ZOOM IN
========================================= */

async function zoomIn() {


  if (!currentPDF) {

    return;

  }


  zoomLevel += 0.2;


  if (
    zoomLevel > 3
  ) {

    zoomLevel = 3;

  }


  await renderPDF();

}


/* =========================================
   ZOOM OUT
========================================= */

async function zoomOut() {


  if (!currentPDF) {

    return;

  }


  zoomLevel -= 0.2;


  if (
    zoomLevel < 0.5
  ) {

    zoomLevel = 0.5;

  }


  await renderPDF();

}


/* =========================================
   ZOOM TEXT
========================================= */

function updateZoomText() {


  const zoomElement =
    document.getElementById(
      "zoomValue"
    );


  if (!zoomElement) {

    return;

  }


  const percent =
    Math.round(
      (zoomLevel / 1.3) * 100
    );


  zoomElement.textContent =
    percent + "%";


}


/* =========================================
   FIT TO SCREEN
========================================= */

async function fitToScreen() {


  if (!currentPDF) {

    return;

  }


  zoomLevel = 1.0;


  await renderPDF();

}


/* =========================================
   DOCUMENT INFORMATION
========================================= */

function updateDocumentInfo() {


  const pagesElement =
    document.getElementById(
      "infoPages"
    );


  const zoomElement =
    document.getElementById(
      "infoZoom"
    );


  const fileElement =
    document.getElementById(
      "infoFile"
    );


  if (!currentPDF) {


    if (pagesElement) {

      pagesElement.textContent =
        "No PDF opened";

    }


    if (zoomElement) {

      zoomElement.textContent =
        "100%";

    }


    if (fileElement) {

      fileElement.textContent =
        "No file selected";

    }


    return;

  }


  const visiblePages =
    currentPDF.numPages -
    deletedPages.size;


  const percent =
    Math.round(
      (zoomLevel / 1.3) * 100
    );


  if (pagesElement) {

    pagesElement.textContent =
      visiblePages;

  }


  if (zoomElement) {

    zoomElement.textContent =
      percent + "%";

  }


  if (fileElement) {

    fileElement.textContent =
      originalFileName;

  }

}


/* =========================================
   SAVE PDF
========================================= */

async function savePDF() {


  if (
    !originalPDFBytes ||
    !currentPDF
  ) {

    alert(
      "पहले कोई PDF खोलें।"
    );

    return;

  }


  if (
    typeof PDFLib ===
    "undefined"
  ) {

    alert(
      "PDF Save Engine लोड नहीं हुआ है।\n\n" +
      "कृपया Ctrl + F5 करके page refresh करें।"
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const oldText =
    saveButton
      ? saveButton.innerHTML
      : "↓ Save PDF";


  try {


    /* =================================
       BUTTON STATUS
    ================================= */

    if (saveButton) {

      saveButton.disabled =
        true;

      saveButton.innerHTML =
        "⏳ Preparing...";

    }


    /*
      IMPORTANT:

      pdf-lib को original bytes
      की एक नई copy दें।

      इससे PDF.js द्वारा किसी
      buffer transfer का असर नहीं होगा।
    */

    const safePDFBytes =
      new Uint8Array(
        originalPDFBytes
      );


    /* =================================
       LOAD SOURCE PDF
    ================================= */

    const sourcePDF =
      await PDFLib.PDFDocument.load(
        safePDFBytes
      );


    /* =================================
       CREATE OUTPUT PDF
    ================================= */

    const outputPDF =
      await PDFLib.PDFDocument.create();


    /* =================================
       FIND PAGES TO KEEP
    ================================= */

    const pageIndexes = [];


    for (
      let i = 0;
      i < sourcePDF.getPageCount();
      i++
    ) {


      const pageNumber =
        i + 1;


      if (
        deletedPages.has(
          pageNumber
        )
      ) {

        continue;

      }


      pageIndexes.push(i);

    }


    /* =================================
       SAFETY CHECK
    ================================= */

    if (
      pageIndexes.length === 0
    ) {

      throw new Error(
        "PDF में कोई page बाकी नहीं है।"
      );

    }


    if (saveButton) {

      saveButton.innerHTML =
        "⏳ Creating PDF...";

    }


    /* =================================
       COPY PAGES
    ================================= */

    const copiedPages =
      await outputPDF.copyPages(
        sourcePDF,
        pageIndexes
      );


    /* =================================
       ADD PAGES
    ================================= */

    copiedPages.forEach(
      function(
        page,
        index
      ) {


        const originalIndex =
          pageIndexes[index];


        const pageNumber =
          originalIndex + 1;


        const userRotation =
          pageRotations[
            pageNumber
          ] || 0;


        /*
          Original PDF rotation
        */

        const originalRotation =
          page.getRotation()
            ? page.getRotation().angle
            : 0;


        /*
          Final rotation
        */

        const finalRotation =
          (
            originalRotation +
            userRotation
          ) % 360;


        page.setRotation(
          PDFLib.degrees(
            finalRotation
          )
        );


        outputPDF.addPage(
          page
        );


      }
    );


    /* =================================
       SAVE OUTPUT
    ================================= */

    const pdfBytes =
      await outputPDF.save();


    /* =================================
       CREATE DOWNLOAD
    ================================= */

    const blob =
      new Blob(
        [pdfBytes],
        {
          type:
            "application/pdf"
        }
      );


    const downloadURL =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      downloadURL;


    /* =================================
       FILE NAME
    ================================= */

    let newName =
      originalFileName;


    if (
      newName
        .toLowerCase()
        .endsWith(".pdf")
    ) {

      newName =
        newName.slice(
          0,
          -4
        );

    }


    link.download =
      newName +
      "-edited.pdf";


    document
      .body
      .appendChild(
        link
      );


    link.click();


    link.remove();


    /*
      थोड़ी देर बाद memory release करें
    */

    setTimeout(
      function() {

        URL.revokeObjectURL(
          downloadURL
        );

      },
      1000
    );


    /* =================================
       SUCCESS
    ================================= */

    if (saveButton) {

      saveButton.innerHTML =
        "✓ Saved";


      setTimeout(
        function() {

          saveButton.innerHTML =
            oldText;

          saveButton.disabled =
            false;

        },
        1800
      );

    }


  } catch (error) {


    console.error(
      "SAVE PDF ERROR:",
      error
    );


    alert(
      "PDF save करने में समस्या हुई।\n\n" +
      error.message
    );


    if (saveButton) {

      saveButton.innerHTML =
        "↓ Save PDF";

      saveButton.disabled =
        false;

    }

  }

}


/* =========================================
   PRINT
========================================= */

function printPDF() {


  if (!currentPDF) {

    alert(
      "पहले PDF खोलें।"
    );

    return;

  }


  window.print();

}

   UNDO PLACEHOLDER
========================================= */

function undoAction() {

  alert(
    "Undo feature अगले चरण में जोड़ा जाएगा।"
  );

}


/* =========================================
   REDO PLACEHOLDER
========================================= */

function redoAction() {

  alert(
    "Redo feature अगले चरण में जोड़ा जाएगा।"
  );

}


/* =========================================
   KEYBOARD SHORTCUTS
========================================= */

document.addEventListener(
  "keydown",
  function(event) {


    /* Ctrl + O */

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "o"
    ) {

      event.preventDefault();

      openFile();

    }


    /* Ctrl + S */

    if (
      event.ctrlKey &&
      event.key.toLowerCase() === "s"
    ) {

      event.preventDefault();

      savePDF();

    }


    /* + */

    if (
      event.key === "+"
    ) {

      zoomIn();

    }


    /* - */

    if (
      event.key === "-"
    ) {

      zoomOut();

    }


  }
);

</script>
