<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSPDF Editor</title>

  <meta name="description" content="Free online PDF editor. Edit and manage PDF files privately in your browser.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #202124;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: relative;
      z-index: 20;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      color: #111827;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .btn {
      border: 1px solid #d9dee8;
      background: white;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      color: #374151;
    }

    .btn:hover {
      background: #f3f4f6;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* =========================
       MAIN AREA
    ========================= */

    .workspace {
      height: calc(100vh - 64px);
      display: flex;
    }

    /* =========================
       LEFT SIDEBAR
    ========================= */

    .sidebar {
      width: 190px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      padding: 16px 10px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      margin: 4px 8px 12px;
    }

    .tool {
      width: 100%;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 8px;
      color: #374151;
      font-size: 14px;
      text-align: left;
      margin-bottom: 3px;
    }

    .tool:hover {
      background: #f3f4f6;
    }

    .tool.active {
      background: #eff6ff;
      color: #2563eb;
      font-weight: 600;
    }

    .tool-icon {
      width: 23px;
      text-align: center;
      font-size: 17px;
    }

    /* =========================
       DOCUMENT AREA
    ========================= */

    .document-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .document-toolbar {
      height: 54px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .small-btn {
      width: 36px;
      height: 34px;
      border: 1px solid #e1e5eb;
      background: white;
      border-radius: 7px;
      font-size: 16px;
    }

    .zoom-value {
      min-width: 65px;
      text-align: center;
      font-size: 13px;
      color: #4b5563;
    }

    .canvas-area {
      flex: 1;
      overflow: auto;
      background: #e9edf3;
      padding: 35px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      width: min(600px, 100%);
      margin-top: 8vh;
      background: white;
      border-radius: 16px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 8px 35px rgba(0,0,0,0.06);
    }

    .upload-icon {
      width: 76px;
      height: 76px;
      margin: auto;
      border-radius: 20px;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .empty-state h1 {
      font-size: 25px;
      margin-top: 20px;
      color: #111827;
    }

    .empty-state p {
      margin: 12px auto 25px;
      max-width: 440px;
      color: #6b7280;
      line-height: 1.6;
      font-size: 14px;
    }

    .choose-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: #2563eb;
      color: white;
      padding: 12px 21px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
    }

    .choose-btn:hover {
      background: #1d4ed8;
    }

    .privacy {
      margin-top: 18px;
      font-size: 12px;
      color: #9ca3af;
    }

    /* =========================
       RIGHT PANEL
    ========================= */

    .right-panel {
      width: 225px;
      background: white;
      border-left: 1px solid #e5e7eb;
      padding: 18px 14px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 13px;
    }

    .panel-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #4b5563;
    }

    .panel-card strong {
      display: block;
      color: #111827;
      margin-bottom: 5px;
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-menu {
      display: none;
    }

    @media (max-width: 850px) {

      body {
        overflow: hidden;
      }

      .topbar {
        height: 58px;
        padding: 0 12px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-icon {
        width: 34px;
        height: 34px;
        font-size: 16px;
      }

      .top-actions .desktop-btn {
        display: none;
      }

      .mobile-menu {
        display: block;
        border: 0;
        background: transparent;
        font-size: 23px;
        margin-right: 3px;
      }

      .workspace {
        height: calc(100vh - 58px);
      }

      .sidebar {
        position: fixed;
        left: -250px;
        top: 58px;
        bottom: 0;
        width: 230px;
        z-index: 30;
        box-shadow: 5px 0 20px rgba(0,0,0,0.1);
        transition: left 0.25s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .right-panel {
        display: none;
      }

      .document-toolbar {
        height: 48px;
      }

      .canvas-area {
        padding: 18px 10px 80px;
      }

      .empty-state {
        margin-top: 7vh;
        padding: 35px 18px;
      }

      .empty-state h1 {
        font-size: 21px;
      }

      .empty-state p {
        font-size: 13px;
      }

      .upload-icon {
        width: 65px;
        height: 65px;
        font-size: 30px;
      }

      .mobile-bottom {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: white;
        border-top: 1px solid #e5e7eb;
        z-index: 20;
        justify-content: space-around;
        align-items: center;
      }

      .bottom-tool {
        border: 0;
        background: transparent;
        font-size: 11px;
        color: #4b5563;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      .bottom-tool span:first-child {
        font-size: 19px;
      }
    }

    @media (min-width: 851px) {
      .mobile-bottom {
        display: none;
      }
    }

  
/* =========================
   STEP 3 - PAGE MANAGER
========================= */

}

  gap: 4px;
  margin-top: 5px;
}

}

}

.zoom-control button {

  background: white;
  border-radius: 7px;
}

@media (max-width: 850px) {

  .page-sidebar {
    position: fixed;
    left: -190px;
    top: 58px;
    bottom: 62px;
    z-index: 40;
    box-shadow: 5px 0 20px rgba(0,0,0,0.12);
    transition: left 0.25s ease;
  }

  .page-sidebar.open {
    left: 0;
  }

    padding: 15px 8px 80px;
  }

  }

    height: auto;
  }
}

<!-- =========================================
     SSPDF EDITOR - STEP 3
     PDF.JS + PAGE THUMBNAILS + ZOOM
     ROTATE + DELETE
========================================= -->


<!-- PDF.JS LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

  /* =========================================
     PDF.JS WORKER
  ========================================= */

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


  /* =========================================
     GLOBAL VARIABLES
  ========================================= */

  let currentPDF = null;

  let zoomLevel = 1.3;

  let pageRotations = {};

  let deletedPages = new Set();

  let selectedPage = 1;


  /* =========================================
     OPEN PDF BUTTON
  ========================================= */

  function openFile() {

    const fileInput =
      document.getElementById("pdfFile");

    if (fileInput) {

      fileInput.click();

    }

  }


  /* =========================================
     MOBILE MENU
  ========================================= */

  function toggleMenu() {

    const sidebar =
      document.getElementById("sidebar");

    if (sidebar) {

      sidebar.classList.toggle("open");

    }

  }


  /* =========================================
     PDF FILE SELECTED
  ========================================= */

  const pdfFile =
    document.getElementById("pdfFile");


  if (pdfFile) {

    pdfFile.addEventListener(
      "change",
      async function () {

        const file =
          this.files[0];


        if (!file) {

          return;

        }


        /* Check file type */

        if (
          file.type !== "application/pdf" &&
          !file.name.toLowerCase().endsWith(".pdf")
        ) {

          alert(
            "कृपया केवल PDF file चुनें।"
          );

          return;

        }


        try {

          console.log(
            "Opening PDF:",
            file.name
          );


          /* Read file locally */

          const arrayBuffer =
            await file.arrayBuffer();


          /* Load PDF */

          currentPDF =
            await pdfjsLib
              .getDocument({
                data: arrayBuffer
              })
              .promise;


          console.log(
            "PDF loaded successfully"
          );


          console.log(
            "Total pages:",
            currentPDF.numPages
          );


          /* Reset editor */

          pageRotations = {};

          deletedPages = new Set();

          selectedPage = 1;

          zoomLevel = 1.3;


          /* Render PDF */

          await renderPDF();


        } catch (error) {

          console.error(
            "PDF ERROR:",
            error
          );


          alert(
            "PDF खोलने में समस्या हुई।\n\n" +
            error.message
          );

        }

      }
    );

  }


  /* =========================================
     RENDER COMPLETE PDF
  ========================================= */

  async function renderPDF() {

    if (!currentPDF) {

      return;

    }


    const viewer =
      document.getElementById(
        "pdfViewer"
      );


    const thumbnails =
      document.getElementById(
        "thumbnails"
      );


    if (!viewer || !thumbnails) {

      alert(
        "PDF viewer element नहीं मिला।"
      );

      return;

    }


    /* Clear old pages */

    viewer.innerHTML = "";

    thumbnails.innerHTML = "";


    /* Render pages */

    for (
      let pageNumber = 1;
      pageNumber <= currentPDF.numPages;
      pageNumber++
    ) {


      /* Skip deleted pages */

      if (
        deletedPages.has(pageNumber)
      ) {

        continue;

      }


      await renderMainPage(
        pageNumber
      );


      await renderThumbnail(
        pageNumber
      );

    }


    updateZoomText();

  }


  /* =========================================
     RENDER MAIN PDF PAGE
  ========================================= */

  async function renderMainPage(
    pageNumber
  ) {


    const page =
      await currentPDF.getPage(
        pageNumber
      );


    const rotation =
      pageRotations[pageNumber] || 0;


    const viewport =
      page.getViewport({

        scale: zoomLevel,

        rotation: rotation

      });


    /* Page wrapper */

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.className =
      "pdf-page-wrapper";


    wrapper.dataset.page =
      pageNumber;


    if (
      pageNumber === selectedPage
    ) {

      wrapper.classList.add(
        "selected-page"
      );

    }


    /* Page label */

    const label =
      document.createElement(
        "div"
      );


    label.className =
      "page-label";


    label.textContent =
      "Page " + pageNumber;


    /* Canvas */

    const canvas =
      document.createElement(
        "canvas"
      );


    const context =
      canvas.getContext(
        "2d"
      );


    canvas.width =
      viewport.width;


    canvas.height =
      viewport.height;


    canvas.style.maxWidth =
      "100%";


    canvas.style.height =
      "auto";


    /* Add elements */

    wrapper.appendChild(
      label
    );


    wrapper.appendChild(
      canvas
    );


    document
      .getElementById(
        "pdfViewer"
      )
      .appendChild(
        wrapper
      );


    /* Render */

    await page.render({

      canvasContext:
        context,

      viewport:
        viewport

    }).promise;


    /* Select page */

    wrapper.addEventListener(
      "click",
      function () {

        selectedPage =
          pageNumber;

        updateSelectedPage();

      }
    );

  }


  /* =========================================
     CREATE PAGE THUMBNAIL
  ========================================= */

  async function renderThumbnail(
    pageNumber
  ) {


    const page =
      await currentPDF.getPage(
        pageNumber
      );


    const rotation =
      pageRotations[pageNumber] || 0;


    const viewport =
      page.getViewport({

        scale: 0.25,

        rotation: rotation

      });


    /* Thumbnail box */

    const box =
      document.createElement(
        "div"
      );


    box.className =
      "page-thumbnail";


    box.dataset.page =
      pageNumber;


    if (
      pageNumber === selectedPage
    ) {

      box.classList.add(
        "active"
      );

    }


    /* Thumbnail canvas */

    const canvas =
      document.createElement(
        "canvas"
      );


    const context =
      canvas.getContext(
        "2d"
      );


    canvas.width =
      viewport.width;


    canvas.height =
      viewport.height;


    /* Page number */

    const number =
      document.createElement(
        "div"
      );


    number.className =
      "page-number";


    number.textContent =
      "Page " + pageNumber;


    /* Action buttons */

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "page-actions";


    /* Rotate button */

    const rotateButton =
      document.createElement(
        "button"
      );


    rotateButton.innerHTML =
      "↻";


    rotateButton.title =
      "Rotate page";


    rotateButton.onclick =
      function (event) {

        event.stopPropagation();

        rotatePage(
          pageNumber
        );

      };


    /* Delete button */

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.innerHTML =
      "🗑";


    deleteButton.title =
      "Delete page";


    deleteButton.onclick =
      function (event) {

        event.stopPropagation();

        deletePage(
          pageNumber
        );

      };


    /* Add buttons */

    actions.appendChild(
      rotateButton
    );


    actions.appendChild(
      deleteButton
    );


    /* Add everything */

    box.appendChild(
      canvas
    );


    box.appendChild(
      number
    );


    box.appendChild(
      actions
    );


    document
      .getElementById(
        "thumbnails"
      )
      .appendChild(
        box
      );


    /* Render thumbnail */

    await page.render({

      canvasContext:
        context,

      viewport:
        viewport

    }).promise;


    /* Thumbnail click */

    box.onclick =
      function () {

        selectedPage =
          pageNumber;


        scrollToPage(
          pageNumber
        );


        updateSelectedPage();

      };

  }


  /* =========================================
     SCROLL TO PAGE
  ========================================= */

  function scrollToPage(
    pageNumber
  ) {


    const page =
      document.querySelector(
        '.pdf-page-wrapper[data-page="' +
        pageNumber +
        '"]'
      );


    if (page) {

      page.scrollIntoView({

        behavior:
          "smooth",

        block:
          "start"

      });

    }

  }


  /* =========================================
     UPDATE SELECTED PAGE
  ========================================= */

  function updateSelectedPage() {


    document
      .querySelectorAll(
        ".pdf-page-wrapper"
      )
      .forEach(
        function (element) {

          element.classList.remove(
            "selected-page"
          );

        }
      );


    document
      .querySelectorAll(
        ".page-thumbnail"
      )
      .forEach(
        function (element) {

          element.classList.remove(
            "active"
          );

        }
      );


    const mainPage =
      document.querySelector(
        '.pdf-page-wrapper[data-page="' +
        selectedPage +
        '"]'
      );


    const thumbnail =
      document.querySelector(
        '.page-thumbnail[data-page="' +
        selectedPage +
        '"]'
      );


    if (mainPage) {

      mainPage.classList.add(
        "selected-page"
      );

    }


    if (thumbnail) {

      thumbnail.classList.add(
        "active"
      );

    }

  }


  /* =========================================
     ROTATE PAGE
  ========================================= */

  async function rotatePage(
    pageNumber
  ) {


    pageRotations[pageNumber] =
      (
        pageRotations[pageNumber] || 0
      ) + 90;


    if (
      pageRotations[pageNumber] >= 360
    ) {

      pageRotations[pageNumber] =
        0;

    }


    selectedPage =
      pageNumber;


    await renderPDF();

  }


  /* =========================================
     DELETE PAGE
  ========================================= */

  async function deletePage(
    pageNumber
  ) {


    if (!currentPDF) {

      return;

    }


    const remainingPages =
      currentPDF.numPages -
      deletedPages.size -
      1;


    /* Don't delete last page */

    if (
      remainingPages < 1
    ) {

      alert(
        "कम से कम एक page रखना जरूरी है।"
      );

      return;

    }


    const confirmDelete =
      confirm(
        "क्या आप Page " +
        pageNumber +
        " को हटाना चाहते हैं?"
      );


    if (!confirmDelete) {

      return;

    }


    deletedPages.add(
      pageNumber
    );


    /* Select another page */

    if (
      selectedPage === pageNumber
    ) {

      selectedPage = 1;


      while (
        deletedPages.has(
          selectedPage
        ) &&
        selectedPage <=
          currentPDF.numPages
      ) {

        selectedPage++;

      }

    }


    await renderPDF();

  }


  /* =========================================
     ZOOM IN
  ========================================= */

  async function zoomIn() {


    if (!currentPDF) {

      return;

    }


    zoomLevel += 0.2;


    if (
      zoomLevel > 3
    ) {

      zoomLevel = 3;

    }


    await renderPDF();

  }


  /* =========================================
     ZOOM OUT
  ========================================= */

  async function zoomOut() {


    if (!currentPDF) {

      return;

    }


    zoomLevel -= 0.2;


    if (
      zoomLevel < 0.5
    ) {

      zoomLevel = 0.5;

    }


    await renderPDF();

  }


  /* =========================================
     UPDATE ZOOM DISPLAY
  ========================================= */

  function updateZoomText() {


    const zoomElement =
      document.getElementById(
        "zoomValue"
      );


    if (!zoomElement) {

      return;

    }


    const percent =
      Math.round(
        (zoomLevel / 1.3) * 100
      );


    zoomElement.textContent =
      percent + "%";

  }


  /* =========================================
     FIT TO SCREEN
  ========================================= */

  async function fitToScreen() {


    if (!currentPDF) {

      return;

    }


    zoomLevel =
      1.0;


    await renderPDF();

  }


  /* =========================================
     KEYBOARD SHORTCUTS
  ========================================= */

  document.addEventListener(
    "keydown",
    function (event) {


      /* Ctrl + O */

      if (
        event.ctrlKey &&
        event.key.toLowerCase() === "o"
      ) {

        event.preventDefault();

        openFile();

      }


      /* + */

      if (
        event.key === "+"
      ) {

        zoomIn();

      }


      /* - */

      if (
        event.key === "-"
      ) {

        zoomOut();

      }

    }
  );

</script>
