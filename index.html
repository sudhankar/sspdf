<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSPDF Editor</title>

<meta name="description"
content="Free browser based PDF editor. Edit PDF privately on your device.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f1f5f9;
  color:#202124;
  height:100vh;
  overflow:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:relative;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:700;
  color:#111827;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:1px solid #d9dee8;
  background:#fff;
  padding:9px 14px;
  border-radius:8px;
  font-size:14px;
  color:#374151;
}

.btn:hover{
  background:#f3f4f6;
}

.btn-primary{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
  font-weight:600;
}

.btn-primary:hover{
  background:#1d4ed8;
}

/* =========================
   WORKSPACE
========================= */

.workspace{
  height:calc(100vh - 64px);
  display:flex;
  min-width:0;
}

/* =========================
   TOOL SIDEBAR
========================= */

.sidebar{
  width:190px;
  background:#fff;
  border-right:1px solid #e5e7eb;
  padding:16px 10px;
  overflow-y:auto;
  flex-shrink:0;
}

.sidebar-title{
  font-size:12px;
  font-weight:700;
  color:#9ca3af;
  text-transform:uppercase;
  margin:4px 8px 12px;
}

.tool{
  width:100%;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:8px;
  color:#374151;
  font-size:14px;
  text-align:left;
  margin-bottom:3px;
}

.tool:hover{
  background:#f3f4f6;
}

.tool.active{
  background:#eff6ff;
  color:#2563eb;
  font-weight:600;
}

.tool-icon{
  width:23px;
  text-align:center;
  font-size:17px;
}

/* =========================
   DOCUMENT AREA
========================= */

.document-area{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

/* =========================
   TOOLBAR
========================= */

.document-toolbar{
  height:54px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-shrink:0;
}

.zoom-control{
  display:flex;
  align-items:center;
  gap:6px;
}

.zoom-control button{
  width:36px;
  height:34px;
  border:1px solid #e1e5eb;
  background:#fff;
  border-radius:7px;
  font-size:16px;
}

.zoom-value{
  min-width:65px;
  text-align:center;
  font-size:13px;
  color:#4b5563;
}

/* =========================
   MAIN PDF AREA
========================= */

.main-document{
  flex:1;
  overflow:auto;
  background:#e9edf3;
  padding:25px;
}

.pdf-page-wrapper{
  position:relative;
  width:fit-content;
  margin:0 auto 25px auto;
  background:#fff;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.pdf-page-wrapper canvas{
  display:block;
  background:#fff;
}

.pdf-page-wrapper.selected-page{
  outline:3px solid #2563eb;
}

.page-label{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:4px 8px;
  border-radius:5px;
  font-size:11px;
  z-index:2;
}

/* =========================
   PAGE SIDEBAR
========================= */

.page-sidebar{
  width:170px;
  background:#f8fafc;
  border-right:1px solid #e5e7eb;
  padding:12px 10px;
  overflow-y:auto;
  flex-shrink:0;
}

.page-sidebar-title{
  font-size:12px;
  font-weight:700;
  color:#6b7280;
  margin:4px 5px 12px;
}

.page-thumbnail{
  position:relative;
  background:#fff;
  border:2px solid transparent;
  border-radius:8px;
  padding:5px;
  margin-bottom:12px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.page-thumbnail.active{
  border-color:#2563eb;
}

.page-thumbnail canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:4px;
}

.page-number{
  text-align:center;
  font-size:11px;
  color:#6b7280;
  margin-top:4px;
}

.page-actions{
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:5px;
}

.page-actions button{
  width:27px;
  height:25px;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:5px;
  font-size:12px;
}

/* =========================
   EMPTY STATE
========================= */

.empty-state{
  width:min(600px,100%);
  margin:8vh auto 0;
  background:#fff;
  border-radius:16px;
  padding:45px 30px;
  text-align:center;
  box-shadow:0 8px 35px rgba(0,0,0,.06);
}

.upload-icon{
  width:76px;
  height:76px;
  margin:auto;
  border-radius:20px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}

.empty-state h1{
  font-size:25px;
  margin-top:20px;
}

.empty-state p{
  margin:12px auto 25px;
  max-width:440px;
  color:#6b7280;
  line-height:1.6;
  font-size:14px;
}

.choose-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:0;
  background:#2563eb;
  color:#fff;
  padding:12px 21px;
  border-radius:9px;
  font-size:15px;
  font-weight:600;
}

.privacy{
  margin-top:18px;
  font-size:12px;
  color:#9ca3af;
}

/* =========================
   RIGHT PANEL
========================= */

.right-panel{
  width:225px;
  background:#fff;
  border-left:1px solid #e5e7eb;
  padding:18px 14px;
  overflow:auto;
  flex-shrink:0;
}

.panel-title{
  font-size:13px;
  font-weight:700;
  color:#6b7280;
  margin-bottom:13px;
}

.panel-card{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:13px;
  color:#4b5563;
  word-break:break-word;
}

.panel-card strong{
  display:block;
  color:#111827;
  margin-bottom:5px;
}

/* =========================
   TEXT EDITOR TOOLBAR
========================= */

.text-toolbar{
  display:none;
  position:fixed;
  top:72px;
  left:50%;
  transform:translateX(-50%);
  z-index:500;
  background:#fff;
  border:1px solid #dbe1ea;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  border-radius:10px;
  padding:8px;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  max-width:95vw;
}

.text-toolbar.show{
  display:flex;
}

.text-toolbar select,
.text-toolbar input{
  height:34px;
  border:1px solid #d1d5db;
  border-radius:6px;
  padding:0 7px;
  background:#fff;
}

.text-toolbar select{
  min-width:150px;
}

.text-toolbar input[type="number"]{
  width:70px;
}

.text-tool-btn{
  height:34px;
  min-width:34px;
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:6px;
  font-weight:600;
}

.text-tool-btn.active{
  background:#eff6ff;
  border-color:#2563eb;
  color:#2563eb;
}

.text-color{
  width:38px !important;
  padding:2px !important;
}

/* =========================
   TEXT BOX
========================= */

.text-box{
  position:absolute;
  min-width:80px;
  min-height:30px;
  border:1px dashed #2563eb;
  background:rgba(255,255,255,.15);
  padding:3px;
  cursor:move;
  z-index:20;
  touch-action:none;
}

.text-box.selected{
  border:2px solid #2563eb;
  background:rgba(239,246,255,.35);
}

.text-box textarea{
  display:block;
  width:100%;
  min-width:70px;
  min-height:28px;
  resize:both;
  border:0;
  outline:0;
  background:transparent;
  overflow:hidden;
  font-family:"Noto Sans Devanagari",Arial,sans-serif;
  color:#111;
  line-height:1.35;
  padding:2px;
}

.text-box-delete{
  position:absolute;
  right:-10px;
  top:-10px;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:#fff;
  font-size:12px;
  display:none;
  z-index:30;
}

.text-box.selected .text-box-delete{
  display:block;
}

/* =========================
   TEXT MODE
========================= */

.text-mode .pdf-page-wrapper{
  cursor:crosshair;
}

/* =========================
   MOBILE
========================= */

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  font-size:23px;
}

.mobile-bottom{
  display:none;
}

@media(max-width:850px){

  .topbar{
    height:58px;
    padding:0 10px;
  }

  .logo{
    font-size:18px;
  }

  .logo-icon{
    width:34px;
    height:34px;
    font-size:16px;
  }

  .mobile-menu{
    display:block;
  }

  .top-actions .desktop-btn{
    display:none;
  }

  .top-actions .btn{
    padding:8px 10px;
  }

  .workspace{
    height:calc(100vh - 58px);
  }

  .sidebar{
    position:fixed;
    left:-250px;
    top:58px;
    bottom:62px;
    width:230px;
    z-index:400;
    box-shadow:5px 0 20px rgba(0,0,0,.15);
    transition:left .25s ease;
  }

  .sidebar.open{
    left:0;
  }

  .page-sidebar{
    position:fixed;
    left:-190px;
    top:58px;
    bottom:62px;
    z-index:350;
    box-shadow:5px 0 20px rgba(0,0,0,.12);
    transition:left .25s ease;
  }

  .page-sidebar.open{
    left:0;
  }

  .right-panel{
    display:none;
  }

  .document-toolbar{
    height:48px;
  }

  .main-document{
    padding:15px 8px 80px;
  }

  .pdf-page-wrapper{
    max-width:100%;
  }

  .pdf-page-wrapper canvas{
    max-width:100%;
    height:auto;
  }

  .mobile-bottom{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#fff;
    border-top:1px solid #e5e7eb;
    z-index:300;
    justify-content:space-around;
    align-items:center;
  }

  .bottom-tool{
    border:0;
    background:transparent;
    font-size:11px;
    color:#4b5563;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }

  .bottom-tool span:first-child{
    font-size:19px;
  }

  .text-toolbar{
    top:62px;
    padding:6px;
    gap:4px;
  }

  .text-toolbar select{
    min-width:120px;
    max-width:140px;
  }

}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.8);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:600;
}

.loading.show{
  display:flex;
}

</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

    ☰
  </button>

  <div class="logo">

    </button>

</header>


<!-- =========================

========================= -->

<div class="text-toolbar" id="textToolbar">

  <select id="fontFamily">

    </option>

    <option value="Noto Serif Devanagari">

    </option>

    class="tool"

     PDF.JS
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- =========================
     PDF-LIB
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>


<!-- =========================
     FONTKIT
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/fontkit/2.0.2/fontkit.umd.min.js"></script>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentPDF = null;

let originalPDFBytes = null;

let originalFileName = "document.pdf";

let zoomLevel = 1.3;

let pageRotations = {};

let deletedPages = new Set();

let selectedPage = 1;

let selectedTextBox = null;

let textMode = false;

let textBoxCounter = 0;


/* =====================================================
   UNDO / REDO
===================================================== */

let undoStack = [];

let redoStack = [];


/* =====================================================
   PDF.JS WORKER
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================================
   OPEN FILE
===================================================== */

function openFile(){

  const input =
    document.getElementById("pdfFile");

  if(input){
    input.click();
  }

}


/* =====================================================
   FILE CHANGE
===================================================== */

document
.getElementById("pdfFile")
.addEventListener("change",async function(){

  const file = this.files[0];

  if(!file){
    return;
  }


  if(
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ){

    alert("कृपया केवल PDF file चुनें।");

    return;
  }


  try{

    showLoading(true);

    originalFileName = file.name;


    const buffer =
      await file.arrayBuffer();


    originalPDFBytes =
      new Uint8Array(buffer);


    currentPDF =
      await pdfjsLib
      .getDocument({
        data:originalPDFBytes
      })
      .promise;


    pageRotations = {};

    deletedPages = new Set();

    selectedPage = 1;

    zoomLevel = 1.3;

    clearTextBoxes();

    disableTextMode();

    await renderPDF();

    updateDocumentInfo();

    showLoading(false);


  }catch(error){

    showLoading(false);

    console.error(error);

    alert(
      "PDF खोलने में समस्या हुई.\n\n" +
      error.message
    );

  }

});


/* =====================================================
   RENDER PDF
===================================================== */

async function renderPDF(){

  if(!currentPDF){
    return;
  }


  const viewer =
    document.getElementById("pdfViewer");

  const thumbnails =
    document.getElementById("thumbnails");


  viewer.innerHTML = "";

  thumbnails.innerHTML = "";


  for(
    let pageNumber = 1;
    pageNumber <= currentPDF.numPages;
    pageNumber++
  ){

    if(deletedPages.has(pageNumber)){
      continue;
    }


    await renderMainPage(pageNumber);

    await renderThumbnail(pageNumber);

  }


  updateZoomText();

  updateDocumentInfo();

}


/* =====================================================
   MAIN PAGE
===================================================== */

async function renderMainPage(pageNumber){

  const page =
    await currentPDF.getPage(pageNumber);


  const rotation =
    pageRotations[pageNumber] || 0;


  const viewport =
    page.getViewport({
      scale:zoomLevel,
      rotation:rotation
    });


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "pdf-page-wrapper";


  wrapper.dataset.page =
    pageNumber;


  if(pageNumber === selectedPage){

    wrapper.classList.add(
      "selected-page"
    );

  }


  const label =
    document.createElement("div");


  label.className =
    "page-label";


  label.textContent =
    "Page " + pageNumber;


  const canvas =
    document.createElement("canvas");


  const context =
    canvas.getContext("2d");


  canvas.width =
    viewport.width;

  canvas.height =
    viewport.height;


  wrapper.appendChild(label);

  wrapper.appendChild(canvas);


  document
  .getElementById("pdfViewer")
  .appendChild(wrapper);


  await page.render({

    canvasContext:context,

    viewport:viewport

  }).promise;


  wrapper.addEventListener(
    "click",
    function(event){

      if(
        event.target === wrapper ||
        event.target === canvas
      ){

        selectedPage =
          pageNumber;

        updateSelectedPage();

      }

    }
  );


  /* Text click */

  wrapper.addEventListener(
    "dblclick",
    function(event){

      if(textMode){

        event.stopPropagation();

      }

    }
  );

}


/* =====================================================
   THUMBNAIL
===================================================== */

async function renderThumbnail(pageNumber){

  const page =
    await currentPDF.getPage(pageNumber);


  const rotation =
    pageRotations[pageNumber] || 0;


  const viewport =
    page.getViewport({

      scale:.25,

      rotation:rotation

    });


  const box =
    document.createElement("div");


  box.className =
    "page-thumbnail";


  box.dataset.page =
    pageNumber;


  if(pageNumber === selectedPage){

    box.classList.add("active");

  }


  const canvas =
    document.createElement("canvas");


  const context =
    canvas.getContext("2d");


  canvas.width =
    viewport.width;

  canvas.height =
    viewport.height;


  const number =
    document.createElement("div");


  number.className =
    "page-number";


  number.textContent =
    "Page " + pageNumber;


  const actions =
    document.createElement("div");


  actions.className =
    "page-actions";


  /* Rotate */

  const rotateButton =
    document.createElement("button");


  rotateButton.innerHTML =
    "↻";


  rotateButton.title =
    "Rotate page";


  rotateButton.onclick =
  function(event){

    event.stopPropagation();

    rotatePage(pageNumber);

  };


  /* Delete */

  const deleteButton =
    document.createElement("button");


  deleteButton.innerHTML =
    "🗑";


  deleteButton.title =
    "Delete page";


  deleteButton.onclick =
  function(event){

    event.stopPropagation();

    deletePage(pageNumber);

  };


  actions.appendChild(
    rotateButton
  );

  actions.appendChild(
    deleteButton
  );


  box.appendChild(canvas);

  box.appendChild(number);

  box.appendChild(actions);


  document
  .getElementById("thumbnails")
  .appendChild(box);


  await page.render({

    canvasContext:context,

    viewport:viewport

  }).promise;


  box.onclick =
  function(){

    selectedPage =
      pageNumber;

    scrollToPage(pageNumber);

    updateSelectedPage();

  };

}


/* =====================================================
   SELECT PAGE
===================================================== */

function updateSelectedPage(){

  document
  .querySelectorAll(".pdf-page-wrapper")
  .forEach(function(el){

    el.classList.remove(
      "selected-page"
    );

  });


  document
  .querySelectorAll(".page-thumbnail")
  .forEach(function(el){

    el.classList.remove(
      "active"
    );

  });


  const page =
    document.querySelector(
      '.pdf-page-wrapper[data-page="' +
      selectedPage +
      '"]'
    );


  const thumb =
    document.querySelector(
      '.page-thumbnail[data-page="' +
      selectedPage +
      '"]'
    );


  if(page){
    page.classList.add(
      "selected-page"
    );
  }


  if(thumb){
    thumb.classList.add(
      "active"
    );
  }

}


/* =====================================================
   SCROLL PAGE
===================================================== */

function scrollToPage(pageNumber){

  const page =
    document.querySelector(
      '.pdf-page-wrapper[data-page="' +
      pageNumber +
      '"]'
    );


  if(page){

    page.scrollIntoView({

      behavior:"smooth",

      block:"start"

    });

  }

}


/* =====================================================
   ROTATE
===================================================== */

async function rotatePage(pageNumber){

  pageRotations[pageNumber] =
    (pageRotations[pageNumber] || 0) + 90;


  if(pageRotations[pageNumber] >= 360){

    pageRotations[pageNumber] = 0;

  }


  selectedPage =
    pageNumber;


  await renderPDF();

}


/* =====================================================
   DELETE PAGE
===================================================== */

async function deletePage(pageNumber){

  if(!currentPDF){
    return;
  }


  const remaining =
    currentPDF.numPages -
    deletedPages.size -
    1;


  if(remaining < 1){

    alert(
      "कम से कम एक page रखना जरूरी है।"
    );

    return;

  }


  if(
    !confirm(
      "क्या आप Page " +
      pageNumber +
      " को हटाना चाहते हैं?"
    )
  ){

    return;

  }


  deletedPages.add(pageNumber);


  selectedPage = 1;


  while(
    deletedPages.has(selectedPage) &&
    selectedPage <= currentPDF.numPages
  ){

    selectedPage++;

  }


  await renderPDF();

}


/* =====================================================
   ZOOM IN
===================================================== */

async function zoomIn(){

  if(!currentPDF){
    return;
  }


  zoomLevel += .2;


  if(zoomLevel > 3){
    zoomLevel = 3;
  }


  await renderPDF();

}


/* =====================================================
   ZOOM OUT
===================================================== */

async function zoomOut(){

  if(!currentPDF){
    return;
  }


  zoomLevel -= .2;


  if(zoomLevel < .5){
    zoomLevel = .5;
  }


  await renderPDF();

}


/* =====================================================
   FIT
===================================================== */

async function fitToScreen(){

  if(!currentPDF){
    return;
  }


  zoomLevel = 1;

  await renderPDF();

}

/* =====================================================
   CREATE TEXT BOX ON PAGE
===================================================== */

document
.getElementById("pdfViewer")
.addEventListener(
  "click",
  function(event){

    if(!textMode){
      return;
    }


    const pageWrapper =
      event.target.closest(
        ".pdf-page-wrapper"
      );


    if(!pageWrapper){
      return;
    }


    /* Don't create when clicking existing text */

    if(
      event.target.closest(
        ".text-box"
      )
    ){

      return;

    }


    const rect =
      pageWrapper.getBoundingClientRect();


    let x =
      event.clientX -
      rect.left;


    let y =
      event.clientY -
      rect.top;


    createTextBox(
      pageWrapper,
      x,
      y
    );

  }
);


/* =====================================================
   CREATE TEXT BOX
===================================================== */

function createTextBox(
  pageWrapper,
  x,
  y
){

  textBoxCounter++;


  const box =
    document.createElement("div");


  box.className =
    "text-box selected";


  box.dataset.id =
    textBoxCounter;


  box.dataset.page =
    pageWrapper.dataset.page;


  box.style.left =
    Math.max(0,x) + "px";


  box.style.top =
    Math.max(0,y) + "px";


  box.style.width =
    "220px";


  box.style.minHeight =
    "35px";


  const textarea =
    document.createElement("textarea");


  textarea.placeholder =
    "यहाँ text लिखें...";


  textarea.value =
    "";


  const deleteButton =
    document.createElement("button");


  deleteButton.className =
    "text-box-delete";


  deleteButton.innerHTML =
    "×";

  function(event){

  box.appendChild(

  );


  pageWrapper.appendChild(
    box
  );


  selectedTextBox =
    box;


  textarea.focus();


  setupTextBoxDrag(
    box,
    pageWrapper
  );


  applyTextStyle();

/* =====================================================
   DRAG TEXT BOX
===================================================== */

function setupTextBoxDrag(
  box,
  pageWrapper
){

  let dragging = false;

  let startX = 0;

  let startY = 0;

  let originalLeft = 0;

  let originalTop = 0;


  box.addEventListener(
    "pointerdown",
    function(event){

      if(
        event.target.tagName ===
        "TEXTAREA"
      ){

        return;

      }


      if(
        event.target.classList.contains(
          "text-box-delete"
        )
      ){

        return;

      }


      dragging = true;


      box.setPointerCapture(
        event.pointerId
      );


      startX =
        event.clientX;

      startY =
        event.clientY;


      originalLeft =
        parseFloat(box.style.left) || 0;


      originalTop =
        parseFloat(box.style.top) || 0;

    }
  );


  box.addEventListener(
    "pointermove",
    function(event){

      if(!dragging){
        return;
      }


      const dx =
        event.clientX -
        startX;


      const dy =
        event.clientY -
        startY;


      let newLeft =
        originalLeft + dx;


      let newTop =
        originalTop + dy;


      const maxLeft =
        pageWrapper.clientWidth -
        box.offsetWidth;


      const maxTop =
        pageWrapper.clientHeight -
        box.offsetHeight;


      newLeft =
        Math.max(
          0,
          Math.min(
            newLeft,
            maxLeft
          )
        );


      newTop =
        Math.max(
          0,
          Math.min(
            newTop,
            maxTop
          )
        );


      box.style.left =
        newLeft + "px";


      box.style.top =
        newTop + "px";

    }
  );


  box.addEventListener(
    "pointerup",
    function(){

      dragging = false;

    }
  );

}

function applyTextStyle(){

  if(!selectedTextBox){
    return;
  }


  const textarea =
    selectedTextBox.querySelector(
      "textarea"
    );


  if(!textarea){
    return;
  }


  const font =
    document.getElementById(
      "fontFamily"

  const size =
    parseInt(
      document.getElementById(
        "fontSize"

    ) || 18;


  const color =
    document.getElementById(

    ).value;


  textarea.style.fontFamily =
    font + ", Arial, sans-serif";


  textarea.style.fontSize =
    size + "px";


  textarea.style.color =
    color;

}


/* =====================================================
   LOAD TEXT STYLE
===================================================== */

function loadTextStyle(){

  if(!selectedTextBox){
    return;
  }


  const textarea =
    selectedTextBox.querySelector(
      "textarea"
    );


  if(!textarea){
    return;
  }


  document.getElementById(
    "fontSize"
  ).value =
    parseInt(
      textarea.style.fontSize
    ) || 18;


  document.getElementById(
    "textColor"
  ).value =
    rgbToHex(
      textarea.style.color
    );


  document.getElementById(
    "fontFamily"
  ).value =
    textarea.style.fontFamily
    .split(",")[0]
    .replaceAll('"',"")
    .trim();

}


/* =====================================================
   RGB TO HEX
===================================================== */

function rgbToHex(rgb){

  if(!rgb){
    return "#111111";
  }


  if(rgb.startsWith("#")){
    return rgb;
  }


  const result =
    rgb.match(
      /\d+/g
    );


  if(!result){
    return "#111111";
  }


  return "#" +
    result
    .slice(0,3)
    .map(function(x){

      return parseInt(x)
      .toString(16)
      .padStart(2,"0");

    })
    .join("");

}

/* =====================================================
   SAVE PDF
===================================================== */

async function savePDF(){

  if(
    !originalPDFBytes ||
    !currentPDF
  ){

    alert(
      "पहले कोई PDF खोलें।"
    );

    return;

  }


  const saveButton =
    document.querySelector(
      ".btn-primary"
    );


  const oldText =
    saveButton
    ? saveButton.innerHTML
    : "";


  try{

    if(saveButton){

      saveButton.disabled = true;

      saveButton.innerHTML =
        "⏳ Saving...";

    }


    showLoading(true);


    /* Load source */

    const sourcePDF =
      await PDFLib.PDFDocument.load(
        originalPDFBytes
      );


    /* Create output */

    const outputPDF =
      await PDFLib.PDFDocument.create();


    /* Register fontkit */

    outputPDF.registerFontkit(
      fontkit
    );


    /* Copy pages */

    const pageIndexes = [];


    for(
      let i=0;
      i<sourcePDF.getPageCount();
      i++
    ){

      const pageNumber =
        i+1;


      if(
        deletedPages.has(
          pageNumber
        )
      ){

        continue;

      }


      pageIndexes.push(i);

    }


    const copiedPages =
      await outputPDF.copyPages(
        sourcePDF,
        pageIndexes
      );


    copiedPages.forEach(
      function(page,index){

        const originalIndex =
          pageIndexes[index];


        const pageNumber =
          originalIndex + 1;


        const originalRotation =
          page.getRotation()
          ? page.getRotation().angle
          : 0;


        const additionalRotation =
          pageRotations[
            pageNumber
          ] || 0;


        const finalRotation =
          (
            originalRotation +
            additionalRotation
          ) % 360;


        page.setRotation(
          PDFLib.degrees(
            finalRotation
          )
        );


        outputPDF.addPage(
          page
        );

      }
    );


    /* =================================================
       ADD TEXT BOXES
    ================================================= */

    const textBoxes =
      document.querySelectorAll(
        ".text-box"
      );


    for(
      const box of textBoxes
    ){

      const pageNumber =
        parseInt(
          box.dataset.page
        );


      const outputPageIndex =
        getOutputPageIndex(
          pageNumber
        );


      if(
        outputPageIndex < 0
      ){

        continue;

      }


      const page =
        outputPDF.getPage(
          outputPageIndex
        );


      const textarea =
        box.querySelector(
          "textarea"
        );


      if(
        !textarea ||
        !textarea.value.trim()
      ){

        continue;

      }


      /* Page dimensions */

      const pdfWidth =
        page.getWidth();


      const pdfHeight =
        page.getHeight();


      const wrapper =
        box.parentElement;


      const displayWidth =
        wrapper.clientWidth;


      const displayHeight =
        wrapper.clientHeight;


      if(
        !displayWidth ||
        !displayHeight
      ){

        continue;

      }


      /* Position */

      const cssX =
        parseFloat(
          box.style.left
        ) || 0;


      const cssY =
        parseFloat(
          box.style.top
        ) || 0;


      const scaleX =
        pdfWidth /
        displayWidth;


      const scaleY =
        pdfHeight /
        displayHeight;


      const x =
        cssX * scaleX;


      const boxHeight =
        box.offsetHeight *
        scaleY;


      const y =
        pdfHeight -
        (
          cssY * scaleY
        ) -
        boxHeight;


      /* Font size */

      const cssFontSize =
        parseFloat(
          textarea.style.fontSize
        ) || 18;


      const pdfFontSize =
        cssFontSize *
        scaleY;


      /* Color */

      const hex =
        textarea.style.color
        ? rgbToHex(
            textarea.style.color
          )
        : "#111111";


      const rgb =
        hexToRgb(hex);


      /* Text */

      const text =
        textarea.value;


      /* Font */

      let embeddedFont;


      try{

        embeddedFont =
          await getFont(
            outputPDF,
            textarea
          );

      }catch(fontError){

        console.warn(
          "Font loading failed:",
          fontError
        );

        embeddedFont =
          await outputPDF.embedFont(
            PDFLib.StandardFonts.Helvetica
          );

      }


      const lines =
        text.split("\n");


      let lineY =
        y +
        boxHeight -
        pdfFontSize;


      const lineHeight =
        pdfFontSize * 1.35;


      for(
        const line of lines
      ){

        if(
          line.trim() === ""
        ){

          lineY -= lineHeight;

          continue;

        }


        page.drawText(
          line,
          {

            x:x,

            y:lineY,

            size:pdfFontSize,

            font:embeddedFont,

            color:
              PDFLib.rgb(
                rgb.r,
                rgb.g,
                rgb.b
              ),

            lineHeight:
              lineHeight

          }
        );


        lineY -= lineHeight;

      }

    }


    /* =================================================
       SAVE
    ================================================= */

    const pdfBytes =
      await outputPDF.save();


    const blob =
      new Blob(
        [pdfBytes],
        {
          type:
            "application/pdf"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    let newName =
      originalFileName;


    if(
      newName
      .toLowerCase()
      .endsWith(".pdf")
    ){

      newName =
        newName.slice(
          0,
          -4
        );

    }


    link.download =
      newName +
      "-edited.pdf";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function(){

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );


    showLoading(false);


    if(saveButton){

      saveButton.innerHTML =
        "✓ Saved";

      setTimeout(
        function(){

          saveButton.innerHTML =
            oldText;

          saveButton.disabled =
            false;

        },
        1800
      );

    }


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    showLoading(false);


    alert(
      "PDF save करने में समस्या हुई.\n\n" +
      error.message
    );


    if(saveButton){

      saveButton.disabled =
        false;

      saveButton.innerHTML =
        "↓ Save PDF";

    }

  }

}


/* =====================================================
   OUTPUT PAGE INDEX
===================================================== */

function getOutputPageIndex(
  originalPageNumber
){

  let index = 0;


  for(
    let i=1;
    i<=currentPDF.numPages;
    i++
  ){

    if(
      deletedPages.has(i)
    ){

      continue;

    }


    if(
      i === originalPageNumber
    ){

      return index;

    }


    index++;

  }


  return -1;

}


/* =====================================================
   FONT LOADER
===================================================== */

async function getFont(
  pdfDoc,
  textarea
){

  const fontName =
    getCleanFontName(
      textarea.style.fontFamily
    );


  let fontURL =
    "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwght%5D.ttf";


  if(
    fontName ===
    "Noto Serif Devanagari"
  ){

    fontURL =
      "https://raw.githubusercontent.com/google/fonts/main/ofl/notoserifdevanagari/NotoSerifDevanagari%5Bwght%5D.ttf";

  }


  if(
    fontName ===
    "Noto Sans"
  ){

    fontURL =
      "https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/NotoSans%5Bwght%5D.ttf";

  }


  const response =
    await fetch(
      fontURL
    );


  if(!response.ok){

    throw new Error(
      "Font download failed"
    );

  }


  const fontBytes =
    await response.arrayBuffer();


  return await pdfDoc.embedFont(
    new Uint8Array(
      fontBytes
    ),
    {
      subset:true
    }
  );

}


/* =====================================================
   CLEAN FONT NAME
===================================================== */

function getCleanFontName(
  value
){

  if(!value){
    return "Noto Sans Devanagari";
  }


  return value
    .split(",")[0]
    .replaceAll('"',"")
    .replaceAll("'","")
    .trim();

}


/* =====================================================
   HEX TO RGB
===================================================== */

function hexToRgb(hex){

  hex =
    hex.replace("#","");


  if(hex.length === 3){

    hex =
      hex
      .split("")
      .map(x=>x+x)
      .join("");

  }


  const number =
    parseInt(
      hex,
      16
    );


  return {

    r:
      ((number >> 16) & 255) / 255,

    g:
      ((number >> 8) & 255) / 255,

    b:
      (number & 255) / 255

  };

}


/* =====================================================
   PRINT
===================================================== */

function printPDF(){

  if(!originalPDFBytes){

    alert(
      "पहले PDF खोलें।"
    );

    return;

  }


  const blob =
    new Blob(
      [originalPDFBytes],
      {
        type:
          "application/pdf"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const win =
    window.open(
      url,
      "_blank"
    );


  if(!win){

    alert(
      "Browser ने print window block कर दी।"
    );

    return;

  }


  setTimeout(
    function(){

      win.print();

    },
    1000
  );

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(show){

  const el =
    document.getElementById(
      "loading"
    );


  if(!el){
    return;
  }


  if(show){

    el.classList.add(
      "show"
    );

  }else{

    el.classList.remove(
      "show"
    );

  }

}

/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    /* Ctrl + O */

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === "o"
    ){

      event.preventDefault();

      openFile();

    }


    /* Ctrl + S */

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      savePDF();

    }


    /* Escape */

    if(
      event.key === "Escape"
    ){

      disableTextMode();

    }


    /* Delete selected text */

    if(
      event.key === "Delete" &&
      selectedTextBox &&
      document.activeElement.tagName !==
      "TEXTAREA"
    ){

      deleteSelectedText();

    }

  }
);
