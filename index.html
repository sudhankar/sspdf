<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSPDF Editor</title>

  <link rel="stylesheet" href="style.css">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- PDF-Lib -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <span class="brand-icon">S</span>
      <span>SSPDF</span>
      <small>PDF Editor</small>
    </div>

    <div class="privacy">
      🔒 Your files stay on your device
    </div>

  </header>


  <!-- HOME / UPLOAD -->

  <main id="homeScreen" class="home">

    <div
      id="dropZone"
      class="drop-zone"
    >

      <div class="pdf-icon">PDF</div>

      <h1>Edit PDF Online</h1>

      <p>
        Open a PDF and edit it directly in your browser.
      </p>

      <p class="privacy-text">
        Your PDF is processed locally and is never uploaded.
      </p>

      <label
        for="fileInput"
        class="primary-btn"
      >
        Choose PDF
      </label>

      <input
        type="file"
        id="fileInput"
        accept="application/pdf"
        hidden
      >

      <div class="drop-hint">
        or drag & drop your PDF here
      </div>

    </div>

  </main>


  <!-- EDITOR -->

  <main
    id="editorScreen"
    class="editor hidden"
  >

    <div class="toolbar">

      <div class="tool-group">

        <button
          id="openAnother"
          title="Open another PDF"
        >
          📂 Open
        </button>

      </div>


      <div class="tool-group">

        <button id="prevPage">
          ◀
        </button>

        <span id="pageInfo">
          1 / 1
        </span>

        <button id="nextPage">
          ▶
        </button>

      </div>


      <div class="tool-group">

        <button id="zoomOut">
          −
        </button>

        <span id="zoomLevel">
          100%
        </span>

        <button id="zoomIn">
          +
        </button>

      </div>


      <div class="tool-group">

        <button
          id="addText"
          class="tool-button"
        >
          T&nbsp; Text
        </button>

        <button
          id="deleteSelected"
          class="tool-button"
        >
          🗑 Delete
        </button>

        <button
          id="undoButton"
          class="tool-button"
        >
          ↶ Undo
        </button>

      </div>


      <div class="toolbar-spacer"></div>


      <button
        id="downloadPDF"
        class="download-button"
      >
        ⬇ Download PDF
      </button>

    </div>


    <div class="workspace">

      <div
        id="pdfContainer"
        class="pdf-container"
      >

        <div
          id="pdfWrapper"
          class="pdf-wrapper"
        >

          <canvas id="pdfCanvas"></canvas>

          <div
            id="textLayer"
            class="text-layer"
          ></div>

        </div>

      </div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
