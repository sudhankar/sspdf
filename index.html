<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSPDF Editor</title>

<meta name="description"
content="Free browser based PDF editor. Your files stay on your device.">

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#202124;
  overflow:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:relative;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:700;
  color:#111827;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#2563eb;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:1px solid #d9dee8;
  background:white;
  padding:9px 14px;
  border-radius:8px;
  font-size:14px;
  color:#374151;
}

.btn:hover{
  background:#f3f4f6;
}

.btn-primary{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
  font-weight:600;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}


/* =====================================================
   WORKSPACE
===================================================== */

.workspace{
  height:calc(100vh - 64px);
  display:flex;
  min-width:0;
}


/* =====================================================
   LEFT TOOL SIDEBAR
===================================================== */

.sidebar{
  width:190px;
  background:#fff;
  border-right:1px solid #e5e7eb;
  padding:16px 10px;
  overflow-y:auto;
  flex-shrink:0;
}

.sidebar-title{
  font-size:12px;
  font-weight:700;
  color:#9ca3af;
  text-transform:uppercase;
  margin:4px 8px 12px;
}

.tool{
  width:100%;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:8px;
  color:#374151;
  font-size:14px;
  text-align:left;
  margin-bottom:3px;
}

.tool:hover{
  background:#f3f4f6;
}

.tool.active{
  background:#eff6ff;
  color:#2563eb;
  font-weight:600;
}

.tool-icon{
  width:23px;
  text-align:center;
  font-size:17px;
}


/* =====================================================
   DOCUMENT AREA
===================================================== */

.document-area{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
}


/* =====================================================
   TOOLBAR
===================================================== */

.document-toolbar{
  height:54px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-shrink:0;
}

.zoom-control{
  display:flex;
  align-items:center;
  gap:6px;
}

.zoom-control button{
  width:36px;
  height:34px;
  border:1px solid #e1e5eb;
  background:#fff;
  border-radius:7px;
  font-size:17px;
}

.zoom-control button:hover{
  background:#f3f4f6;
}

.zoom-value{
  min-width:65px;
  text-align:center;
  font-size:13px;
  color:#4b5563;
}


/* =====================================================
   MAIN DOCUMENT
===================================================== */

.main-document{
  flex:1;
  overflow:auto;
  background:#e9edf3;
  padding:25px;
  min-width:0;
  min-height:0;
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state{
  width:min(600px,100%);
  margin:8vh auto 0;
  background:white;
  border-radius:16px;
  padding:45px 30px;
  text-align:center;
  box-shadow:0 8px 35px rgba(0,0,0,.06);
}

.upload-icon{
  width:76px;
  height:76px;
  margin:auto;
  border-radius:20px;
  background:#eff6ff;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}

.empty-state h1{
  font-size:25px;
  margin-top:20px;
  color:#111827;
}

.empty-state p{
  margin:12px auto 25px;
  max-width:440px;
  color:#6b7280;
  line-height:1.6;
  font-size:14px;
}

.choose-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:0;
  background:#2563eb;
  color:white;
  padding:12px 21px;
  border-radius:9px;
  font-size:15px;
  font-weight:600;
}

.choose-btn:hover{
  background:#1d4ed8;
}

.privacy{
  margin-top:18px;
  font-size:12px;
  color:#9ca3af;
}


/* =====================================================
   PAGE SIDEBAR
===================================================== */

.page-sidebar{
  width:170px;
  background:#f8fafc;
  border-right:1px solid #e5e7eb;
  padding:12px 10px;
  overflow-y:auto;
  flex-shrink:0;
}

.page-sidebar-title{
  font-size:12px;
  font-weight:700;
  color:#6b7280;
  margin:4px 5px 12px;
}

.page-thumbnail{
  position:relative;
  background:white;
  border:2px solid transparent;
  border-radius:8px;
  padding:5px;
  margin-bottom:12px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.page-thumbnail:hover{
  border-color:#cbd5e1;
}

.page-thumbnail.active{
  border-color:#2563eb;
}

.page-thumbnail canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:4px;
}

.page-number{
  text-align:center;
  font-size:11px;
  color:#6b7280;
  margin-top:4px;
}

.page-actions{
  display:flex;
  justify-content:center;
  gap:4px;
  margin-top:5px;
}

.page-actions button{
  width:27px;
  height:25px;
  border:1px solid #e5e7eb;
  background:white;
  border-radius:5px;
  font-size:12px;
}

.page-actions button:hover{
  background:#f3f4f6;
}


/* =====================================================
   PDF PAGE
===================================================== */

.pdf-page-wrapper{
  position:relative;
  width:fit-content;
  margin:0 auto 25px;
}

.pdf-page-wrapper canvas{
  display:block;
  background:white;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.pdf-page-wrapper.selected-page canvas{
  outline:3px solid #2563eb;
}

.page-label{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,.65);
  color:white;
  padding:4px 8px;
  border-radius:5px;
  font-size:11px;
  z-index:5;
}


/* =====================================================
   RIGHT PANEL
===================================================== */

.right-panel{
  width:225px;
  background:white;
  border-left:1px solid #e5e7eb;
  padding:18px 14px;
  flex-shrink:0;
}

.panel-title{
  font-size:13px;
  font-weight:700;
  color:#6b7280;
  margin-bottom:13px;
}

.panel-card{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  font-size:13px;
  color:#4b5563;
  word-break:break-word;
}

.panel-card strong{
  display:block;
  color:#111827;
  margin-bottom:5px;
}


/* =====================================================
   MOBILE MENU
===================================================== */

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  font-size:23px;
}


/* =====================================================
   MOBILE BOTTOM
===================================================== */

.mobile-bottom{
  display:none;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px){

  body{
    overflow:hidden;
  }

  .topbar{
    height:58px;
    padding:0 12px;
  }

  .logo{
    font-size:18px;
  }

  .logo-icon{
    width:34px;
    height:34px;
    font-size:16px;
  }

  .top-actions .desktop-btn{
    display:none;
  }

  .mobile-menu{
    display:block;
    margin-right:5px;
  }

  .workspace{
    height:calc(100vh - 58px);
  }

  .sidebar{
    position:fixed;
    left:-250px;
    top:58px;
    bottom:62px;
    width:230px;
    z-index:90;
    box-shadow:5px 0 20px rgba(0,0,0,.12);
    transition:left .25s ease;
  }

  .sidebar.open{
    left:0;
  }

  .right-panel{
    display:none;
  }

  .page-sidebar{
    position:fixed;
    left:-190px;
    top:58px;
    bottom:62px;
    width:190px;
    z-index:80;
    box-shadow:5px 0 20px rgba(0,0,0,.12);
    transition:left .25s ease;
  }

  .page-sidebar.open{
    left:0;
  }

  .document-toolbar{
    height:48px;
  }

  .main-document{
    padding:15px 8px 80px;
  }

  .pdf-page-wrapper{
    max-width:100%;
  }

  .pdf-page-wrapper canvas{
    max-width:100%;
    height:auto;
  }

  .empty-state{
    margin-top:7vh;
    padding:35px 18px;
  }

  .empty-state h1{
    font-size:21px;
  }

  .empty-state p{
    font-size:13px;
  }

  .upload-icon{
    width:65px;
    height:65px;
    font-size:30px;
  }

  .mobile-bottom{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:white;
    border-top:1px solid #e5e7eb;
    z-index:100;
    justify-content:space-around;
    align-items:center;
  }

  .bottom-tool{
    border:0;
    background:transparent;
    font-size:11px;
    color:#4b5563;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }

  .bottom-tool span:first-child{
    font-size:19px;
  }

}

</style>

</head>

  </button>

     IMPORTANT:
     FILE INPUT IS OUTSIDE pdfViewer

  type="file"
  id="pdfFile"

  style="display:none;">



<!-- =====================================================
     PDF.JS
===================================================== -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>


<!-- =====================================================
     PDF-LIB
===================================================== -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
</script>



<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentPDF = null;

let originalPDFBytes = null;

let zoomLevel = 1.3;

let pageRotations = {};

let deletedPages = new Set();

let selectedPage = 1;

let originalFileName = "document.pdf";


/* =====================================================
   PDF.JS WORKER
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================================
   OPEN FILE
===================================================== */

function openFile(){

  const fileInput =
    document.getElementById("pdfFile");

  if(!fileInput){

    alert("PDF file selector नहीं मिला।");

    return;
  }

  /*
    Important:
    same PDF को दोबारा भी select करने देने के लिए
    value खाली करते हैं।
  */

  fileInput.value = "";

  fileInput.click();

}


/* =====================================================
   FILE SELECTED
===================================================== */

const pdfFile =
document.getElementById("pdfFile");


if(pdfFile){

  pdfFile.addEventListener(
    "change",
    async function(){

      const file =
        this.files[0];

      if(!file){
        return;
      }


      if(
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
      ){

        alert(
          "कृपया केवल PDF file चुनें।"
        );

        return;
      }


      try{

        originalFileName =
          file.name;


        const arrayBuffer =
          await file.arrayBuffer();


        originalPDFBytes =
          new Uint8Array(arrayBuffer);


        currentPDF =
          await pdfjsLib
          .getDocument({
            data:originalPDFBytes
          })
          .promise;


        pageRotations = {};

        deletedPages =
          new Set();

        selectedPage = 1;

        zoomLevel = 1.3;


        await renderPDF();


        updateDocumentInfo();


      }
      catch(error){

        console.error(
          "PDF ERROR:",
          error
        );


        alert(
          "PDF खोलने में समस्या हुई.\n\n" +
          error.message
        );

      }

    }
  );

}


/* =====================================================
   RENDER PDF
===================================================== */

async function renderPDF(){

  if(!currentPDF){
    return;
  }


  const viewer =
    document.getElementById(
      "pdfViewer"
    );


  const thumbnails =
    document.getElementById(
      "thumbnails"
    );


  if(!viewer || !thumbnails){

    alert(
      "PDF viewer element नहीं मिला।"
    );

    return;
  }


  /*
    केवल PDF pages हटेंगे।
    File input सुरक्षित रहेगा क्योंकि
    वह pdfViewer के बाहर है।
  */

  viewer.innerHTML = "";


  thumbnails.innerHTML = "";


  for(
    let pageNumber = 1;
    pageNumber <= currentPDF.numPages;
    pageNumber++
  ){

    if(
      deletedPages.has(pageNumber)
    ){

      continue;

    }


    await renderMainPage(
      pageNumber
    );


    await renderThumbnail(
      pageNumber
    );

  }


  updateZoomText();

  updateDocumentInfo();

}


/* =====================================================
   MAIN PAGE
===================================================== */

async function renderMainPage(
  pageNumber
){

  const page =
    await currentPDF.getPage(
      pageNumber
    );


  const rotation =
    pageRotations[pageNumber] || 0;


  const viewport =
    page.getViewport({

      scale:zoomLevel,

      rotation:rotation

    });


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "pdf-page-wrapper";


  wrapper.dataset.page =
    pageNumber;


  if(
    pageNumber === selectedPage
  ){

    wrapper.classList.add(
      "selected-page"
    );

  }


  const label =
    document.createElement("div");


  label.className =
    "page-label";


  label.textContent =
    "Page " + pageNumber;


  const canvas =
    document.createElement("canvas");


  const context =
    canvas.getContext("2d");


  canvas.width =
    viewport.width;


  canvas.height =
    viewport.height;


  canvas.style.maxWidth =
    "100%";


  canvas.style.height =
    "auto";


  wrapper.appendChild(label);

  wrapper.appendChild(canvas);


  document
  .getElementById("pdfViewer")
  .appendChild(wrapper);


  await page.render({

    canvasContext:context,

    viewport:viewport

  }).promise;


  wrapper.addEventListener(
    "click",
    function(){

      selectedPage =
        pageNumber;

      updateSelectedPage();

    }
  );

}


/* =====================================================
   THUMBNAIL
===================================================== */

async function renderThumbnail(
  pageNumber
){

  const page =
    await currentPDF.getPage(
      pageNumber
    );


  const rotation =
    pageRotations[pageNumber] || 0;


  const viewport =
    page.getViewport({

      scale:.25,

      rotation:rotation

    });


  const box =
    document.createElement("div");


  box.className =
    "page-thumbnail";


  box.dataset.page =
    pageNumber;


  if(
    pageNumber === selectedPage
  ){

    box.classList.add(
      "active"
    );

  }


  const canvas =
    document.createElement("canvas");


  const context =
    canvas.getContext("2d");


  canvas.width =
    viewport.width;


  canvas.height =
    viewport.height;


  const number =
    document.createElement("div");


  number.className =
    "page-number";


  number.textContent =
    "Page " + pageNumber;


  const actions =
    document.createElement("div");


  actions.className =
    "page-actions";


  /* ROTATE */

  const rotateButton =
    document.createElement("button");


  rotateButton.innerHTML =
    "↻";


  rotateButton.title =
    "Rotate page";


  rotateButton.onclick =
    function(event){

      event.stopPropagation();

      rotatePage(pageNumber);

    };


  /* DELETE */

  const deleteButton =
    document.createElement("button");


  deleteButton.innerHTML =
    "🗑";


  deleteButton.title =
    "Delete page";


  deleteButton.onclick =
    function(event){

      event.stopPropagation();

      deletePage(pageNumber);

    };


  actions.appendChild(
    rotateButton
  );


  actions.appendChild(
    deleteButton
  );


  box.appendChild(canvas);

  box.appendChild(number);

  box.appendChild(actions);


  document
  .getElementById("thumbnails")
  .appendChild(box);


  await page.render({

    canvasContext:context,

    viewport:viewport

  }).promise;


  box.onclick =
    function(){

      selectedPage =
        pageNumber;


      scrollToPage(
        pageNumber
      );


      updateSelectedPage();

    };

}


/* =====================================================
   SCROLL TO PAGE
===================================================== */

function scrollToPage(
  pageNumber
){

  const page =
    document.querySelector(
      '.pdf-page-wrapper[data-page="' +
      pageNumber +
      '"]'
    );


  if(page){

    page.scrollIntoView({

      behavior:"smooth",

      block:"start"

    });

  }

}


/* =====================================================
   SELECT PAGE
===================================================== */

function updateSelectedPage(){

  document
  .querySelectorAll(
    ".pdf-page-wrapper"
  )
  .forEach(
    function(element){

      element.classList.remove(
        "selected-page"
      );

    }
  );


  document
  .querySelectorAll(
    ".page-thumbnail"
  )
  .forEach(
    function(element){

      element.classList.remove(
        "active"
      );

    }
  );


  const mainPage =
    document.querySelector(
      '.pdf-page-wrapper[data-page="' +
      selectedPage +
      '"]'
    );


  const thumbnail =
    document.querySelector(
      '.page-thumbnail[data-page="' +
      selectedPage +
      '"]'
    );


  if(mainPage){

    mainPage.classList.add(
      "selected-page"
    );

  }


  if(thumbnail){

    thumbnail.classList.add(
      "active"
    );

  }

}


/* =====================================================
   ROTATE PAGE
===================================================== */

async function rotatePage(
  pageNumber
){

  pageRotations[pageNumber] =
    (
      pageRotations[pageNumber] || 0
    ) + 90;


  if(
    pageRotations[pageNumber] >= 360
  ){

    pageRotations[pageNumber] = 0;

  }


  selectedPage =
    pageNumber;


  await renderPDF();

}


/* =====================================================
   ROTATE SELECTED PAGE
===================================================== */

function rotateSelectedPage(){

  if(!currentPDF){

    alert(
      "पहले कोई PDF खोलें।"
    );

    return;
  }


  rotatePage(
    selectedPage
  );

}


/* =====================================================
   DELETE PAGE
===================================================== */

async function deletePage(
  pageNumber
){

  if(!currentPDF){
    return;
  }


  const remainingPages =
    currentPDF.numPages -
    deletedPages.size -
    1;


  if(remainingPages < 1){

    alert(
      "कम से कम एक page रखना जरूरी है।"
    );

    return;
  }


  const confirmDelete =
    confirm(
      "क्या आप Page " +
      pageNumber +
      " को हटाना चाहते हैं?"
    );


  if(!confirmDelete){
    return;
  }


  deletedPages.add(
    pageNumber
  );


  selectedPage = 1;


  while(
    deletedPages.has(selectedPage) &&
    selectedPage <= currentPDF.numPages
  ){

    selectedPage++;

  }


  if(
    selectedPage > currentPDF.numPages
  ){

    selectedPage = 1;

  }


  await renderPDF();

}


/* =====================================================
   DELETE SELECTED PAGE
===================================================== */

function deleteSelectedPage(){

  if(!currentPDF){

    alert(
      "पहले कोई PDF खोलें।"
    );

    return;
  }


  deletePage(
    selectedPage
  );

}


/* =====================================================
   ZOOM IN
===================================================== */

async function zoomIn(){

  if(!currentPDF){
    return;
  }


  zoomLevel += .2;


  if(zoomLevel > 3){
    zoomLevel = 3;
  }


  await renderPDF();

}


/* =====================================================
   ZOOM OUT
===================================================== */

async function zoomOut(){

  if(!currentPDF){
    return;
  }


  zoomLevel -= .2;


  if(zoomLevel < .5){
    zoomLevel = .5;
  }


  await renderPDF();

}


/* =====================================================
   ZOOM TEXT
===================================================== */

function updateZoomText(){

  const zoomElement =
    document.getElementById(
      "zoomValue"
    );


  if(!zoomElement){
    return;
  }


  const percent =
    Math.round(
      (zoomLevel / 1.3) * 100
    );


  zoomElement.textContent =
    percent + "%";


  const infoZoom =
    document.getElementById(
      "infoZoom"
    );


  if(infoZoom){

    infoZoom.textContent =
      percent + "%";

  }

}


/* =====================================================
   FIT TO SCREEN
===================================================== */

async function fitToScreen(){

  if(!currentPDF){
    return;
  }


  zoomLevel = 1.0;


  await renderPDF();

}


/* =====================================================
   DOCUMENT INFORMATION
===================================================== */

function updateDocumentInfo(){

  const infoPages =
    document.getElementById(
      "infoPages"
    );


  const infoFile =
    document.getElementById(
      "infoFile"
    );


  const visiblePages =
    currentPDF
    ?
    currentPDF.numPages -
    deletedPages.size
    :
    0;


  if(infoPages){

    infoPages.textContent =
      currentPDF
      ?
      visiblePages
      :
      "No PDF opened";

  }


  if(infoFile){

    infoFile.textContent =
      currentPDF
      ?
      originalFileName
      :
      "No file selected";

  }


  updateZoomText();

}


/* =====================================================
   SAVE PDF
===================================================== */

async function savePDF(){

  if(
    !originalPDFBytes ||
    !currentPDF
  ){

    alert(
      "पहले कोई PDF खोलें।"
    );

    return;
  }


  try{

    const saveButton =
      document.getElementById(
        "saveButton"
      );


    const oldText =
      saveButton
      ?
      saveButton.innerHTML
      :
      "";


    if(saveButton){

      saveButton.innerHTML =
        "⏳ Saving...";

      saveButton.disabled =
        true;

    }


    const sourcePDF =
      await PDFLib.PDFDocument.load(
        originalPDFBytes
      );


    const outputPDF =
      await PDFLib.PDFDocument.create();


    const pageIndexes = [];


    for(
      let i = 0;
      i < sourcePDF.getPageCount();
      i++
    ){

      const pageNumber =
        i + 1;


      if(
        deletedPages.has(pageNumber)
      ){

        continue;

      }


      pageIndexes.push(i);

    }


    const copiedPages =
      await outputPDF.copyPages(
        sourcePDF,
        pageIndexes
      );


    copiedPages.forEach(
      function(page,index){

        const originalIndex =
          pageIndexes[index];


        const pageNumber =
          originalIndex + 1;


        const extraRotation =
          pageRotations[pageNumber] || 0;


        const originalRotation =
          page.getRotation()
          ?
          page.getRotation().angle
          :
          0;


        const finalRotation =
          (
            originalRotation +
            extraRotation
          ) % 360;


        page.setRotation(
          PDFLib.degrees(
            finalRotation
          )
        );


        outputPDF.addPage(
          page
        );

      }
    );


    const pdfBytes =
      await outputPDF.save();


    const blob =
      new Blob(
        [pdfBytes],
        {
          type:"application/pdf"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement("a");


    link.href =
      url;


    let newName =
      originalFileName;


    if(
      newName
      .toLowerCase()
      .endsWith(".pdf")
    ){

      newName =
        newName.slice(
          0,
          -4
        );

    }


    link.download =
      newName +
      "-edited.pdf";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      url
    );


    if(saveButton){

      saveButton.innerHTML =
        "✓ Saved";


      setTimeout(
        function(){

          saveButton.innerHTML =
            oldText;


          saveButton.disabled =
            false;

        },
        1800
      );

    }


  }
  catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    alert(
      "PDF save करने में समस्या हुई.\n\n" +
      error.message
    );


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    if(saveButton){

      saveButton.disabled =
        false;

      saveButton.innerHTML =
        "↓ Save PDF";

    }

  }

}

/* =====================================================
   TOOL SELECTION
===================================================== */

function selectTool(
  button,
  tool
){

  document
  .querySelectorAll(
    ".tool"
  )
  .forEach(
    function(item){

      item.classList.remove(
        "active"
      );

    }
  );


  if(button){

    button.classList.add(
      "active"
    );

  }


  /*
    Text और दूसरे tools को
    अगली step में functional बनाया जाएगा।
  */


  if(
    tool === "text" ||
    tool === "highlight" ||
    tool === "textbox" ||
    tool === "signature" ||
    tool === "image" ||
    tool === "crop" ||
    tool === "merge" ||
    tool === "split" ||
    tool === "reorder"
  ){

    alert(
      "यह tool अगली step में बनाया जाएगा।"
    );

  }

}

/* =====================================================
   PRINT
===================================================== */

function printPDF(){

  if(!originalPDFBytes){

    alert(
      "पहले कोई PDF खोलें।"
    );

    return;
  }


  const blob =
    new Blob(
      [originalPDFBytes],
      {
        type:"application/pdf"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const printWindow =
    window.open(
      url,
      "_blank"
    );


  if(!printWindow){

    alert(
      "Browser ने print window block कर दी।"
    );

    return;

  }


  setTimeout(
    function(){

      printWindow.print();

    },
    1000
  );

}

/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    /* CTRL + O */

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === "o"
    ){

      event.preventDefault();

      openFile();

    }


    /* CTRL + S */

    if(
      event.ctrlKey &&
      event.key.toLowerCase() === "s"
    ){

      event.preventDefault();

      savePDF();

    }


    /* ZOOM + */

    if(
      event.key === "+"
    ){

      zoomIn();

    }


    /* ZOOM - */

    if(
      event.key === "-"
    ){

      zoomOut();

    }

  }
);
